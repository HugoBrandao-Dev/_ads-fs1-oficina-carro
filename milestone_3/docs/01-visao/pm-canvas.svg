<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" font-family="Arial, Helvetica, sans-serif">
  <title>PM Canvas do FilaCidadã</title>
  <desc>Canvas de gerenciamento de projeto em grade de 4 colunas e 3 linhas, com 11 blocos: Justificativas, Objetivos, Benefícios, Stakeholders, Produto, Requisitos, Premissas, Restrições, Riscos, Linha do tempo e Custos. A linha do tempo ocupa duas colunas na última linha.</desc>

  <rect x="0" y="0" width="1600" height="980" fill="#ffffff"/>

  <!-- Cabeçalho -->
  <text x="20" y="50" font-size="26" font-weight="bold" fill="#111111">PM Canvas: FilaCidadã</text>
  <text x="20" y="80" font-size="14" fill="#555555">Fábrica de Software I · Milestone 1 · situação em 06/11/2026</text>
  <text x="1580" y="50" font-size="14" text-anchor="end" fill="#555555">Patrocinador: Município de Exemplo (fictício)</text>
  <rect x="20" y="98" width="1560" height="3" fill="#1f5fbf"/>

  <!-- Linha A -->
  <rect x="20" y="120" width="375" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="20" y="120" width="375" height="36" fill="#f2f2f2"/>
  <text x="34" y="144" font-size="15" font-weight="bold" fill="#1f5fbf">Justificativas</text>
  <g font-size="13" fill="#333333">
    <text x="34" y="180">• Cidadão espera sem saber quando será chamado</text>
    <text x="34" y="202">• Instituição não registra quem foi atendido</text>
    <text x="34" y="224">• Filas online e presenciais em um só lugar</text>
    <text x="34" y="246">• Base de API já existente para web e mobile</text>
  </g>

  <rect x="415" y="120" width="375" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="415" y="120" width="375" height="36" fill="#f2f2f2"/>
  <text x="429" y="144" font-size="15" font-weight="bold" fill="#1f5fbf">Objetivos</text>
  <g font-size="13" fill="#333333">
    <text x="429" y="180">OBJ-01 Emitir senha online e presencial</text>
    <text x="429" y="202">OBJ-02 Chamar e finalizar atendimentos</text>
    <text x="429" y="224">OBJ-03 Configurar filas, mesas e QR Codes</text>
    <text x="429" y="246">OBJ-04 Painel e trilha de auditoria</text>
    <text x="429" y="268">OBJ-05 Cadastro, papéis e aprovação</text>
  </g>
  <text x="429" y="290" font-size="12" fill="#555555">Casos de uso de cada objetivo: pm-canvas.md</text>

  <rect x="810" y="120" width="375" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="810" y="120" width="375" height="36" fill="#f2f2f2"/>
  <text x="824" y="144" font-size="15" font-weight="bold" fill="#1f5fbf">Benefícios</text>
  <g font-size="13" fill="#333333">
    <text x="824" y="180">• Cidadão acompanha a posição sem ir ao balcão</text>
    <text x="824" y="202">• Atendente chama a próxima senha sem papel</text>
    <text x="824" y="224">• Gestor vê volume e tempos no painel</text>
    <text x="824" y="246">• Cada ação administrativa fica registrada</text>
    <text x="824" y="268">• Web, mobile e GraphQL com a mesma regra</text>
  </g>

  <rect x="1205" y="120" width="375" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="1205" y="120" width="375" height="36" fill="#f2f2f2"/>
  <text x="1219" y="144" font-size="15" font-weight="bold" fill="#1f5fbf">Stakeholders</text>
  <g font-size="13" fill="#333333">
    <text x="1219" y="180">Cidadão (ACT-01)</text>
    <text x="1219" y="202">Operador (ACT-02)</text>
    <text x="1219" y="224">Administrador da instituição (ACT-03)</text>
    <text x="1219" y="246">Administrador da plataforma (ACT-04)</text>
    <text x="1219" y="268">Cliente patrocinador (órgão fictício)</text>
    <text x="1219" y="290">Equipe de desenvolvimento (alunos)</text>
    <text x="1219" y="312">Professor avaliador</text>
  </g>

  <!-- Linha B -->
  <rect x="20" y="406" width="375" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="20" y="406" width="375" height="36" fill="#f2f2f2"/>
  <text x="34" y="430" font-size="15" font-weight="bold" fill="#1f5fbf">Produto</text>
  <g font-size="13" fill="#333333">
    <text x="34" y="466">• API FilaCidadã: REST, GraphQL e Socket.IO</text>
    <text x="34" y="488">• Login e sessão pelo BetterAuth</text>
    <text x="34" y="510">• PostgreSQL 17 com Prisma 6</text>
    <text x="34" y="532">• Clientes: site e aplicativo móvel</text>
    <text x="34" y="554">• Documentação e wireframes por perfil</text>
  </g>

  <rect x="415" y="406" width="375" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="415" y="406" width="375" height="36" fill="#f2f2f2"/>
  <text x="429" y="430" font-size="15" font-weight="bold" fill="#1f5fbf">Requisitos (macro)</text>
  <g font-size="13" fill="#333333">
    <text x="429" y="466">Autenticação e perfil: UC-01, UC-02</text>
    <text x="429" y="488">Instituições e usuários: UC-03 a UC-05</text>
    <text x="429" y="510">Filas e atendimento: UC-06 a UC-11, UC-15</text>
    <text x="429" y="532">QR Code, painel e auditoria: UC-12 a UC-14</text>
    <text x="429" y="562" font-weight="bold">Sem caso de uso no catálogo:</text>
    <text x="429" y="584">flows, chat, notificações e landing page</text>
  </g>

  <rect x="810" y="406" width="375" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="810" y="406" width="375" height="36" fill="#f2f2f2"/>
  <text x="824" y="430" font-size="15" font-weight="bold" fill="#1f5fbf">Premissas</text>
  <g font-size="13" fill="#333333">
    <text x="824" y="466">• Balcão consegue exibir ou imprimir QR Code</text>
    <text x="824" y="488">• Cidadão tem celular com navegador ou app</text>
    <text x="824" y="510">• Aula roda com Docker e PostgreSQL 17</text>
    <text x="824" y="532">• NPaaS pode ficar desligado nas aulas</text>
    <text x="824" y="554">• Cliente responde as perguntas da RFP</text>
  </g>

  <rect x="1205" y="406" width="375" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="1205" y="406" width="375" height="36" fill="#f2f2f2"/>
  <text x="1219" y="430" font-size="15" font-weight="bold" fill="#1f5fbf">Restrições</text>
  <g font-size="13" fill="#333333">
    <text x="1219" y="466">• Node 22, Express 5 e Prisma 6 fixados</text>
    <text x="1219" y="488">• E-mail só pelo NPaaS, sem SMTP</text>
    <text x="1219" y="510">• Formato da resposta e código 498 mantidos</text>
    <text x="1219" y="532">• Prazo da disciplina: datas a definir</text>
    <text x="1219" y="554">• Fora: pagamento, agendamento, prontuário</text>
  </g>

  <!-- Linha C -->
  <rect x="20" y="692" width="375" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="20" y="692" width="375" height="36" fill="#f2f2f2"/>
  <text x="34" y="716" font-size="15" font-weight="bold" fill="#1f5fbf">Riscos</text>
  <g font-size="13" fill="#333333">
    <text x="34" y="752">• NPaaS fora do ar: e-mail e push não saem</text>
    <text x="34" y="774">• LGPD: ainda sem tratamento no código</text>
    <text x="34" y="796">• Escopo cresce: flows, chat e painel</text>
    <text x="34" y="818">• Helmet desligado: CSP sem revisão</text>
    <text x="34" y="840">• Dados de exemplo não mostram o pico</text>
  </g>

  <rect x="415" y="692" width="770" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="415" y="692" width="770" height="36" fill="#f2f2f2"/>
  <text x="429" y="716" font-size="15" font-weight="bold" fill="#1f5fbf">Linha do tempo</text>
  <line x1="480" y1="822" x2="1120" y2="822" stroke="#8a8a8a" stroke-width="2"/>
  <g font-size="12" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="510" y="800">2026/1</text>
    <text x="655" y="800">29/07/2026</text>
    <text x="800" y="800">30/09/2026</text>
    <text x="945" y="800">14/10/2026</text>
    <text x="1090" y="800">A definir</text>
  </g>
  <circle cx="510" cy="822" r="6" fill="#1f5fbf"/>
  <circle cx="655" cy="822" r="6" fill="#1f5fbf"/>
  <circle cx="800" cy="822" r="6" fill="#1f5fbf"/>
  <circle cx="945" cy="822" r="6" fill="#1f5fbf"/>
  <circle cx="1090" cy="822" r="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/>
  <g font-size="12" fill="#333333" text-anchor="middle">
    <text x="510" y="848">Versão Mongo + JWT</text>
    <text x="510" y="866">(legado)</text>
    <text x="655" y="848">Migração para SQL</text>
    <text x="655" y="866">e BetterAuth</text>
    <text x="800" y="848">GraphQL e documentação</text>
    <text x="800" y="866">em Markdown</text>
    <text x="945" y="848">Coleções Postman</text>
    <text x="945" y="866">do GraphQL</text>
    <text x="1090" y="848">Milestones 1 a 3</text>
    <text x="1090" y="866">datas a definir</text>
  </g>
  <text x="429" y="934" font-size="12" fill="#555555">Fontes: git log do repositório e documentacao/12-historico.md</text>

  <rect x="1205" y="692" width="375" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a"/>
  <rect x="1205" y="692" width="375" height="36" fill="#f2f2f2"/>
  <text x="1219" y="716" font-size="15" font-weight="bold" fill="#1f5fbf">Custos</text>
  <g font-size="13" fill="#333333">
    <text x="1219" y="752">• Infraestrutura de aula: Docker local</text>
    <text x="1219" y="774">• PostgreSQL 17 em contêiner</text>
    <text x="1219" y="796">• NPaaS (e-mail e push): a definir</text>
    <text x="1219" y="818">• Armazenamento S3 (opcional): a definir</text>
    <text x="1219" y="840">• Esforço da equipe: a estimar</text>
  </g>
  <text x="1219" y="862" font-size="12" fill="#555555">Valores ainda não estão no repositório</text>
</svg>
