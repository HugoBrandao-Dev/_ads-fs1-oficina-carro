<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1010" width="1160" height="1010" font-family="sans-serif" role="img" aria-labelledby="seq-aprovar-t seq-aprovar-d">
  <title id="seq-aprovar-t">Sequência: aprovar solicitação de instituição (UC-04)</title>
  <desc id="seq-aprovar-d">Administrador da plataforma aprova solicitação por PATCH /instituicoes/:id/aprovar. Passa por Express com AuthMiddleware e authorize(ADMIN_PLATAFORMA), InstituicaoController, InstituicaoService, Repositórios e PostgreSQL. Fragmento alt com guardas: instituição não encontrada (404), status diferente de PENDENTE e REJEITADA (400), aprovação com auditoria e e-mail assíncrono ao solicitante.</desc>
  <defs>
    <marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1160" height="1010" fill="#ffffff"/>

  <!-- Fragmento alt externo -->
  <rect x="16" y="280" width="1128" height="630" fill="none" stroke="#555"/>
  <rect x="16" y="280" width="40" height="18" fill="#1f4e9a"/>
  <text x="24" y="293" font-size="12" font-weight="bold" fill="#fff">alt</text>
  <text x="64" y="293" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[instituição não encontrada]</text>
  <line x1="16" y1="400" x2="1144" y2="400" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="415" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: status diferente de PENDENTE e REJEITADA]</text>
  <line x1="16" y1="520" x2="1144" y2="520" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="535" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: status PENDENTE ou REJEITADA]</text>

  <!-- Fragmento opt: solicitante com usuário -->
  <rect x="34" y="676" width="1092" height="114" fill="none" stroke="#555"/>
  <rect x="34" y="676" width="40" height="18" fill="#555"/>
  <text x="42" y="689" font-size="12" font-weight="bold" fill="#fff">opt</text>
  <text x="82" y="689" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[solicitanteId preenchido]</text>

  <!-- Linhas de vida -->
  <g stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="64" x2="100" y2="966"/>
    <line x1="260" y1="64" x2="260" y2="966"/>
    <line x1="420" y1="64" x2="420" y2="966"/>
    <line x1="580" y1="64" x2="580" y2="966"/>
    <line x1="740" y1="64" x2="740" y2="966"/>
    <line x1="900" y1="64" x2="900" y2="966"/>
    <line x1="1060" y1="64" x2="1060" y2="966"/>
  </g>

  <!-- Participantes -->
  <g stroke="#333" stroke-width="1" fill="#f2f2f2">
    <rect x="27" y="14" width="146" height="50" rx="4"/>
    <rect x="187" y="14" width="146" height="50" rx="4"/>
    <rect x="347" y="14" width="146" height="50" rx="4"/>
    <rect x="507" y="14" width="146" height="50" rx="4"/>
    <rect x="667" y="14" width="146" height="50" rx="4"/>
    <rect x="827" y="14" width="146" height="50" rx="4"/>
    <rect x="987" y="14" width="146" height="50" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="100" y="35" font-size="13" font-weight="bold">Admin Plataforma</text>
    <text x="100" y="53" font-size="12" fill="#444">ACT-04</text>
    <text x="260" y="35" font-size="13" font-weight="bold">Express</text>
    <text x="260" y="53" font-size="12" fill="#444">rota + AuthMiddleware</text>
    <text x="420" y="35" font-size="13" font-weight="bold">Controller</text>
    <text x="420" y="53" font-size="12" fill="#444">InstituicaoController</text>
    <text x="580" y="35" font-size="13" font-weight="bold">Service</text>
    <text x="580" y="53" font-size="12" fill="#444">InstituicaoService</text>
    <text x="740" y="35" font-size="13" font-weight="bold">Repositórios</text>
    <text x="740" y="53" font-size="12" fill="#444">Instituição, Usuário</text>
    <text x="900" y="35" font-size="13" font-weight="bold">PostgreSQL</text>
    <text x="900" y="53" font-size="12" fill="#444">instituicoes, users</text>
    <text x="1060" y="35" font-size="13" font-weight="bold">MailService</text>
    <text x="1060" y="53" font-size="12" fill="#444">NPaaS (e-mail)</text>
  </g>

  <!-- Entrada, autorização e consulta -->
  <g>
    <line x1="100" y1="100" x2="260" y2="100" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="76" y="80" width="208" height="16" fill="#fff"/>
    <text x="180" y="92" font-size="12" text-anchor="middle" fill="#222">PATCH /instituicoes/:id/aprovar</text>

    <path d="M260,122 H292 V138 H260" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="296" y="110" width="182" height="16" fill="#fff"/>
    <text x="300" y="122" font-size="12" fill="#222">authorize(ADMIN_PLATAFORMA)</text>

    <line x1="260" y1="160" x2="420" y2="160" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="279" y="140" width="122" height="16" fill="#fff"/>
    <text x="340" y="152" font-size="12" text-anchor="middle" fill="#222">aprovar(id, body)</text>

    <line x1="420" y1="194" x2="580" y2="194" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="376" y="174" width="248" height="16" fill="#fff"/>
    <text x="500" y="186" font-size="12" text-anchor="middle" fill="#222">aprovar(id, { observacao }, usuario)</text>

    <line x1="580" y1="228" x2="740" y2="228" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="606" y="208" width="109" height="16" fill="#fff"/>
    <text x="660" y="220" font-size="12" text-anchor="middle" fill="#222">buscarPorId(id)</text>

    <line x1="740" y1="262" x2="900" y2="262" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="756" y="242" width="129" height="16" fill="#fff"/>
    <text x="820" y="254" font-size="12" text-anchor="middle" fill="#222">SELECT instituicao</text>
  </g>

  <!-- Guarda 1: não encontrada -->
  <g>
    <line x1="580" y1="316" x2="420" y2="316" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="485" y="296" width="30" height="16" fill="#fff"/>
    <text x="500" y="308" font-size="12" text-anchor="middle" fill="#222">404</text>

    <line x1="420" y1="350" x2="260" y2="350" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="325" y="330" width="30" height="16" fill="#fff"/>
    <text x="340" y="342" font-size="12" text-anchor="middle" fill="#222">404</text>

    <line x1="260" y1="384" x2="100" y2="384" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="165" y="364" width="30" height="16" fill="#fff"/>
    <text x="180" y="376" font-size="12" text-anchor="middle" fill="#222">404</text>
  </g>

  <!-- Guarda 2: status inválido -->
  <g>
    <line x1="580" y1="436" x2="420" y2="436" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="433" y="416" width="135" height="16" fill="#fff"/>
    <text x="500" y="428" font-size="12" text-anchor="middle" fill="#222">400 status inválido</text>

    <line x1="420" y1="470" x2="260" y2="470" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="325" y="450" width="30" height="16" fill="#fff"/>
    <text x="340" y="462" font-size="12" text-anchor="middle" fill="#222">400</text>

    <line x1="260" y1="504" x2="100" y2="504" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="165" y="484" width="30" height="16" fill="#fff"/>
    <text x="180" y="496" font-size="12" text-anchor="middle" fill="#222">400</text>
  </g>

  <!-- Guarda 3: aprovação -->
  <g>
    <line x1="580" y1="556" x2="740" y2="556" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="556" y="536" width="208" height="16" fill="#fff"/>
    <text x="660" y="548" font-size="12" text-anchor="middle" fill="#222">atualizar(APROVADA, ativo=true)</text>

    <line x1="740" y1="590" x2="900" y2="590" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="756" y="570" width="129" height="16" fill="#fff"/>
    <text x="820" y="582" font-size="12" text-anchor="middle" fill="#222">UPDATE instituicoes</text>

    <line x1="580" y1="624" x2="740" y2="624" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="563" y="604" width="195" height="16" fill="#fff"/>
    <text x="660" y="616" font-size="12" text-anchor="middle" fill="#222">registrar APROVAR_INSTITUICAO</text>

    <line x1="740" y1="658" x2="900" y2="658" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="759" y="638" width="122" height="16" fill="#fff"/>
    <text x="820" y="650" font-size="12" text-anchor="middle" fill="#222">INSERT auditorias</text>

    <line x1="580" y1="708" x2="740" y2="708" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="596" y="688" width="129" height="16" fill="#fff"/>
    <text x="660" y="700" font-size="12" text-anchor="middle" fill="#222">buscar solicitante</text>

    <line x1="740" y1="742" x2="900" y2="742" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="776" y="722" width="89" height="16" fill="#fff"/>
    <text x="820" y="734" font-size="12" text-anchor="middle" fill="#222">SELECT users</text>

    <line x1="580" y1="776" x2="1060" y2="776" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="708" y="756" width="222" height="16" fill="#fff"/>
    <text x="820" y="768" font-size="12" text-anchor="middle" fill="#222">enviarEmailInstituicaoAprovada</text>

    <line x1="580" y1="824" x2="420" y2="824" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="416" y="804" width="168" height="16" fill="#fff"/>
    <text x="500" y="816" font-size="12" text-anchor="middle" fill="#222">200 instituição aprovada</text>

    <line x1="420" y1="858" x2="260" y2="858" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="325" y="838" width="30" height="16" fill="#fff"/>
    <text x="340" y="850" font-size="12" text-anchor="middle" fill="#222">200</text>

    <line x1="260" y1="892" x2="100" y2="892" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="112" y="872" width="135" height="16" fill="#fff"/>
    <text x="180" y="884" font-size="12" text-anchor="middle" fill="#222">200 { data: instituicao }</text>
  </g>

  <!-- Nota de domínio -->
  <rect x="16" y="926" width="1128" height="26" fill="#f2f2f2" stroke="#999"/>
  <text x="26" y="943" font-size="12" fill="#222">Nota: aprovar não cria o ADMIN_INSTITUICAO nem vincula instituicaoId a ninguém; isso ocorre no cadastro de usuário (UC-05).</text>

  <text x="16" y="980" font-size="12" fill="#444">Legenda: seta cheia = chamada; seta tracejada = retorno; [guarda] = condição do alt; opt = trecho opcional.</text>
  <text x="16" y="996" font-size="12" fill="#444">E-mail enviado sem await: falha no envio não altera a resposta HTTP.</text>
</svg>
