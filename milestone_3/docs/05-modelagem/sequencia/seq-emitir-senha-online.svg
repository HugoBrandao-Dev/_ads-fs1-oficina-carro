<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1300" width="1160" height="1300" font-family="sans-serif" role="img" aria-labelledby="seq-online-t seq-online-d">
  <title id="seq-online-t">Sequência: emitir senha online (UC-08)</title>
  <desc id="seq-online-d">Cidadão cria senha em fila ativa por POST /filas/:filaId/senhas. Passa por Express com AuthMiddleware, SenhaController, SenhaService, Repositórios e PostgreSQL, e emite o evento senha:criada pelo Socket.IO. Fragmento alt com guardas: fila inválida ou inativa (400), senha ativa existente (409), caminho de sucesso. QR Code validado só para fila PRESENCIAL.</desc>
  <defs>
    <marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1160" height="1300" fill="#ffffff"/>

  <!-- Fragmento alt -->
  <rect x="16" y="492" width="1128" height="756" fill="none" stroke="#555"/>
  <rect x="16" y="492" width="40" height="18" fill="#1f4e9a"/>
  <text x="24" y="505" font-size="12" font-weight="bold" fill="#fff">alt</text>
  <text x="64" y="505" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[fila inválida ou inativa]</text>
  <line x1="16" y1="614" x2="1144" y2="614" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="629" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: já existe senha ativa do usuário na fila]</text>
  <line x1="16" y1="740" x2="1144" y2="740" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="755" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: fila ativa e sem senha ativa]</text>

  <!-- Linhas de vida -->
  <g stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="64" x2="100" y2="1256"/>
    <line x1="260" y1="64" x2="260" y2="1256"/>
    <line x1="420" y1="64" x2="420" y2="1256"/>
    <line x1="580" y1="64" x2="580" y2="1256"/>
    <line x1="740" y1="64" x2="740" y2="1256"/>
    <line x1="900" y1="64" x2="900" y2="1256"/>
    <line x1="1060" y1="64" x2="1060" y2="1256"/>
  </g>

  <!-- Participantes -->
  <g stroke="#333" stroke-width="1" fill="#f2f2f2">
    <rect x="27" y="14" width="146" height="50" rx="4"/>
    <rect x="187" y="14" width="146" height="50" rx="4"/>
    <rect x="347" y="14" width="146" height="50" rx="4"/>
    <rect x="507" y="14" width="146" height="50" rx="4"/>
    <rect x="667" y="14" width="146" height="50" rx="4"/>
    <rect x="827" y="14" width="146" height="50" rx="4"/>
    <rect x="987" y="14" width="146" height="50" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="100" y="35" font-size="13" font-weight="bold">Cidadão</text>
    <text x="100" y="53" font-size="12" fill="#444">ACT-01 · app cliente</text>
    <text x="260" y="35" font-size="13" font-weight="bold">Express</text>
    <text x="260" y="53" font-size="12" fill="#444">rota + AuthMiddleware</text>
    <text x="420" y="35" font-size="13" font-weight="bold">SenhaController</text>
    <text x="420" y="53" font-size="12" fill="#444">valida body (zod)</text>
    <text x="580" y="35" font-size="13" font-weight="bold">SenhaService</text>
    <text x="580" y="53" font-size="12" fill="#444">regras de negócio</text>
    <text x="740" y="35" font-size="13" font-weight="bold">Repositórios</text>
    <text x="740" y="53" font-size="12" fill="#444">Fila, Senha, QrCode</text>
    <text x="900" y="35" font-size="13" font-weight="bold">PostgreSQL</text>
    <text x="900" y="53" font-size="12" fill="#444">tabelas do domínio</text>
    <text x="1060" y="35" font-size="13" font-weight="bold">Socket.IO</text>
    <text x="1060" y="53" font-size="12" fill="#444">EventBusService</text>
  </g>

  <!-- Autorização no próprio Express (self-call) -->
  <path d="M260,130 H292 V146 H260" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
  <rect x="296" y="117" width="241" height="16" fill="#fff"/>
  <text x="300" y="129" font-size="12" fill="#222">AuthMiddleware: papel USUARIO_FINAL</text>

  <!-- Caminho comum: entrada e consulta -->
  <g>
    <line x1="100" y1="100" x2="260" y2="100" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="89" y="80" width="182" height="16" fill="#fff"/>
    <text x="180" y="92" font-size="12" text-anchor="middle" fill="#222">POST /filas/:filaId/senhas</text>

    <line x1="260" y1="170" x2="420" y2="170" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="266" y="150" width="149" height="16" fill="#fff"/>
    <text x="340" y="162" font-size="12" text-anchor="middle" fill="#222">criar(body, req.user)</text>

    <line x1="420" y1="204" x2="580" y2="204" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="396" y="184" width="208" height="16" fill="#fff"/>
    <text x="500" y="196" font-size="12" text-anchor="middle" fill="#222">criar({ usuario, filaId, ... })</text>

    <line x1="580" y1="238" x2="740" y2="238" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="593" y="218" width="135" height="16" fill="#fff"/>
    <text x="660" y="230" font-size="12" text-anchor="middle" fill="#222">buscarPorId(filaId)</text>

    <line x1="740" y1="272" x2="900" y2="272" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="779" y="252" width="83" height="16" fill="#fff"/>
    <text x="820" y="264" font-size="12" text-anchor="middle" fill="#222">SELECT fila</text>

    <line x1="900" y1="306" x2="740" y2="306" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="802" y="286" width="36" height="16" fill="#fff"/>
    <text x="820" y="298" font-size="12" text-anchor="middle" fill="#222">fila</text>

    <line x1="740" y1="340" x2="580" y2="340" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="642" y="320" width="36" height="16" fill="#fff"/>
    <text x="660" y="332" font-size="12" text-anchor="middle" fill="#222">fila</text>

    <line x1="580" y1="374" x2="740" y2="374" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="569" y="354" width="182" height="16" fill="#fff"/>
    <text x="660" y="366" font-size="12" text-anchor="middle" fill="#222">buscarAtivaPorUsuarioEFila</text>

    <line x1="740" y1="408" x2="900" y2="408" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="756" y="388" width="129" height="16" fill="#fff"/>
    <text x="820" y="400" font-size="12" text-anchor="middle" fill="#222">SELECT senha ativa</text>

    <line x1="900" y1="442" x2="740" y2="442" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="772" y="422" width="96" height="16" fill="#fff"/>
    <text x="820" y="434" font-size="12" text-anchor="middle" fill="#222">senha ou nula</text>

    <line x1="740" y1="476" x2="580" y2="476" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="626" y="456" width="69" height="16" fill="#fff"/>
    <text x="660" y="468" font-size="12" text-anchor="middle" fill="#222">resultado</text>
  </g>

  <!-- Guarda 1: fila inválida ou inativa -->
  <g>
    <line x1="580" y1="530" x2="420" y2="530" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="439" y="510" width="122" height="16" fill="#fff"/>
    <text x="500" y="522" font-size="12" text-anchor="middle" fill="#222">400 Fila inválida</text>

    <line x1="420" y1="564" x2="260" y2="564" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="325" y="544" width="30" height="16" fill="#fff"/>
    <text x="340" y="556" font-size="12" text-anchor="middle" fill="#222">400</text>

    <line x1="260" y1="598" x2="100" y2="598" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="165" y="578" width="30" height="16" fill="#fff"/>
    <text x="180" y="590" font-size="12" text-anchor="middle" fill="#222">400</text>
  </g>

  <!-- Guarda 2: senha ativa existente -->
  <g>
    <line x1="580" y1="656" x2="420" y2="656" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="419" y="636" width="162" height="16" fill="#fff"/>
    <text x="500" y="648" font-size="12" text-anchor="middle" fill="#222">409 Senha ativa na fila</text>

    <line x1="420" y1="690" x2="260" y2="690" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="325" y="670" width="30" height="16" fill="#fff"/>
    <text x="340" y="682" font-size="12" text-anchor="middle" fill="#222">409</text>

    <line x1="260" y1="724" x2="100" y2="724" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="165" y="704" width="30" height="16" fill="#fff"/>
    <text x="180" y="716" font-size="12" text-anchor="middle" fill="#222">409</text>
  </g>

  <!-- Guarda 3: caminho de sucesso -->
  <g>
    <line x1="580" y1="790" x2="740" y2="790" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="602" y="770" width="116" height="16" fill="#fff"/>
    <text x="660" y="782" font-size="12" text-anchor="middle" fill="#222">validar QR Code*</text>

    <line x1="740" y1="824" x2="900" y2="824" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="742" y="804" width="155" height="16" fill="#fff"/>
    <text x="820" y="816" font-size="12" text-anchor="middle" fill="#222">SELECT qr_codes válido</text>

    <line x1="900" y1="858" x2="740" y2="858" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="786" y="838" width="69" height="16" fill="#fff"/>
    <text x="820" y="850" font-size="12" text-anchor="middle" fill="#222">QR válido</text>

    <line x1="580" y1="892" x2="740" y2="892" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="573" y="872" width="175" height="16" fill="#fff"/>
    <text x="660" y="884" font-size="12" text-anchor="middle" fill="#222">calcular posição e número</text>

    <line x1="740" y1="926" x2="900" y2="926" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="726" y="906" width="188" height="16" fill="#fff"/>
    <text x="820" y="918" font-size="12" text-anchor="middle" fill="#222">SELECT max(posicao, numero)</text>

    <line x1="900" y1="960" x2="740" y2="960" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="762" y="940" width="116" height="16" fill="#fff"/>
    <text x="820" y="952" font-size="12" text-anchor="middle" fill="#222">posição e número</text>

    <line x1="580" y1="994" x2="740" y2="994" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="579" y="974" width="162" height="16" fill="#fff"/>
    <text x="660" y="986" font-size="12" text-anchor="middle" fill="#222">criar(senha AGUARDANDO)</text>

    <line x1="740" y1="1028" x2="900" y2="1028" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="772" y="1008" width="96" height="16" fill="#fff"/>
    <text x="820" y="1020" font-size="12" text-anchor="middle" fill="#222">INSERT senhas</text>

    <line x1="580" y1="1062" x2="740" y2="1062" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="592" y="1042" width="135" height="16" fill="#fff"/>
    <text x="660" y="1054" font-size="12" text-anchor="middle" fill="#222">registrar auditoria</text>

    <line x1="740" y1="1096" x2="900" y2="1096" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="759" y="1076" width="122" height="16" fill="#fff"/>
    <text x="820" y="1088" font-size="12" text-anchor="middle" fill="#222">INSERT auditorias</text>

    <line x1="580" y1="1130" x2="1060" y2="1130" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="776" y="1110" width="89" height="16" fill="#fff"/>
    <text x="820" y="1122" font-size="12" text-anchor="middle" fill="#222">senha:criada</text>

    <line x1="580" y1="1164" x2="420" y2="1164" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="456" y="1144" width="89" height="16" fill="#fff"/>
    <text x="500" y="1156" font-size="12" text-anchor="middle" fill="#222">senha criada</text>

    <line x1="420" y1="1198" x2="260" y2="1198" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="325" y="1178" width="30" height="16" fill="#fff"/>
    <text x="340" y="1190" font-size="12" text-anchor="middle" fill="#222">201</text>

    <line x1="260" y1="1232" x2="100" y2="1232" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="116" y="1212" width="129" height="16" fill="#fff"/>
    <text x="180" y="1224" font-size="12" text-anchor="middle" fill="#222">201 { data: senha }</text>
  </g>

  <text x="16" y="1282" font-size="12" fill="#444">Legenda: seta cheia = chamada; seta tracejada = retorno; [guarda] = condição do alt; *somente fila PRESENCIAL.</text>
</svg>
