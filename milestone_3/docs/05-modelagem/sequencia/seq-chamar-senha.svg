<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1980" width="1160" height="1980" font-family="sans-serif" role="img" aria-labelledby="seq-chamar-t seq-chamar-d">
  <title id="seq-chamar-t">Sequência: chamar, rechamar e assumir senha (UC-10)</title>
  <desc id="seq-chamar-d">Operador chama senha AGUARDANDO por POST /senhas/:id/chamar, com loop que pula cidadão já em atendimento. Alternativas: rechamar (somente operador responsável) e assumir (administrador da instituição assume senha de outro operador). Passa por Express, SenhaController, SenhaService, Repositórios e PostgreSQL, e emite eventos pelo Socket.IO.</desc>
  <defs>
    <marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1160" height="1980" fill="#ffffff"/>

  <!-- Fragmento alt externo: três ações -->
  <rect x="16" y="80" width="1128" height="1824" fill="none" stroke="#555"/>
  <rect x="16" y="80" width="40" height="18" fill="#1f4e9a"/>
  <text x="24" y="93" font-size="12" font-weight="bold" fill="#fff">alt</text>
  <text x="64" y="93" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[chamar: senha AGUARDANDO e operador livre]</text>
  <line x1="16" y1="976" x2="1144" y2="976" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="991" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: rechamar, operador responsável pela senha]</text>
  <line x1="16" y1="1368" x2="1144" y2="1368" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="1383" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: assumir, ADMIN_INSTITUICAO e senha de outro operador]</text>

  <!-- Fragmento loop dentro de chamar -->
  <rect x="34" y="340" width="1092" height="84" fill="none" stroke="#555"/>
  <rect x="34" y="340" width="40" height="18" fill="#555"/>
  <text x="42" y="353" font-size="12" font-weight="bold" fill="#fff">loop</text>
  <text x="82" y="353" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[enquanto cidadão já em atendimento na instituição]</text>

  <!-- Linhas de vida -->
  <g stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="64" x2="100" y2="1936"/>
    <line x1="260" y1="64" x2="260" y2="1936"/>
    <line x1="420" y1="64" x2="420" y2="1936"/>
    <line x1="580" y1="64" x2="580" y2="1936"/>
    <line x1="740" y1="64" x2="740" y2="1936"/>
    <line x1="900" y1="64" x2="900" y2="1936"/>
    <line x1="1060" y1="64" x2="1060" y2="1936"/>
  </g>

  <!-- Participantes -->
  <g stroke="#333" stroke-width="1" fill="#f2f2f2">
    <rect x="27" y="14" width="146" height="50" rx="4"/>
    <rect x="187" y="14" width="146" height="50" rx="4"/>
    <rect x="347" y="14" width="146" height="50" rx="4"/>
    <rect x="507" y="14" width="146" height="50" rx="4"/>
    <rect x="667" y="14" width="146" height="50" rx="4"/>
    <rect x="827" y="14" width="146" height="50" rx="4"/>
    <rect x="987" y="14" width="146" height="50" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="100" y="35" font-size="13" font-weight="bold">Operador</text>
    <text x="100" y="53" font-size="12" fill="#444">ACT-02 ou ACT-03</text>
    <text x="260" y="35" font-size="13" font-weight="bold">Express</text>
    <text x="260" y="53" font-size="12" fill="#444">rota + AuthMiddleware</text>
    <text x="420" y="35" font-size="13" font-weight="bold">SenhaController</text>
    <text x="420" y="53" font-size="12" fill="#444">valida body e ação</text>
    <text x="580" y="35" font-size="13" font-weight="bold">SenhaService</text>
    <text x="580" y="53" font-size="12" fill="#444">transições de estado</text>
    <text x="740" y="35" font-size="13" font-weight="bold">Repositórios</text>
    <text x="740" y="53" font-size="12" fill="#444">Senha, Fila, Auditoria</text>
    <text x="900" y="35" font-size="13" font-weight="bold">PostgreSQL</text>
    <text x="900" y="53" font-size="12" fill="#444">senhas, notificacoes</text>
    <text x="1060" y="35" font-size="13" font-weight="bold">Socket.IO</text>
    <text x="1060" y="53" font-size="12" fill="#444">EventBusService</text>
  </g>

  <!-- Ação 1: chamar -->
  <g>
    <line x1="100" y1="120" x2="260" y2="120" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="76" y="100" width="208" height="16" fill="#fff"/>
    <text x="180" y="112" font-size="12" text-anchor="middle" fill="#222">POST /senhas/:id/chamar {mesa}</text>

    <line x1="260" y1="154" x2="420" y2="154" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="253" y="134" width="175" height="16" fill="#fff"/>
    <text x="340" y="146" font-size="12" text-anchor="middle" fill="#222">chamar(id, usuario, mesa)</text>

    <line x1="420" y1="188" x2="580" y2="188" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="396" y="168" width="208" height="16" fill="#fff"/>
    <text x="500" y="180" font-size="12" text-anchor="middle" fill="#222">chamarSenha(id, usuario, mesa)</text>

    <line x1="580" y1="222" x2="740" y2="222" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="606" y="202" width="109" height="16" fill="#fff"/>
    <text x="660" y="214" font-size="12" text-anchor="middle" fill="#222">buscarPorId(id)</text>

    <line x1="740" y1="256" x2="900" y2="256" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="776" y="236" width="89" height="16" fill="#fff"/>
    <text x="820" y="248" font-size="12" text-anchor="middle" fill="#222">SELECT senha</text>

    <line x1="900" y1="290" x2="740" y2="290" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="798" y="270" width="43" height="16" fill="#fff"/>
    <text x="820" y="282" font-size="12" text-anchor="middle" fill="#222">senha</text>

    <line x1="740" y1="324" x2="580" y2="324" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="638" y="304" width="43" height="16" fill="#fff"/>
    <text x="660" y="316" font-size="12" text-anchor="middle" fill="#222">senha</text>
  </g>

  <!-- Loop: cidadão já em atendimento (pula para a próxima) -->
  <g>
    <line x1="580" y1="372" x2="740" y2="372" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="560" y="352" width="201" height="16" fill="#fff"/>
    <text x="660" y="364" font-size="12" text-anchor="middle" fill="#222">buscar atendimento do cidadão</text>

    <line x1="580" y1="406" x2="740" y2="406" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="562" y="386" width="195" height="16" fill="#fff"/>
    <text x="660" y="398" font-size="12" text-anchor="middle" fill="#222">mover senha e buscar próxima</text>
  </g>

