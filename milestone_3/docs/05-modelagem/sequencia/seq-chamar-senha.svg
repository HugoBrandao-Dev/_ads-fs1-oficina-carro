    <rect x="752" y="846" width="135" height="16" fill="#fff"/>
    <text x="820" y="858" font-size="12" text-anchor="middle" fill="#222">INSERT notificacoes</text>

    <line x1="580" y1="900" x2="420" y2="900" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
