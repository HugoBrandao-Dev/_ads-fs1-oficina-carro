  <text x="16" y="1942" font-size="12" fill="#444">Legenda: seta cheia = chamada; seta tracejada = retorno; [guarda] = condição do alt; loop = repetição.</text>
  <text x="16" y="1960" font-size="12" fill="#444">Erros omitidos: 409 (status, operador ocupado, mesa em uso); 403 (instituição diferente ou responsável).</text>
</svg>
