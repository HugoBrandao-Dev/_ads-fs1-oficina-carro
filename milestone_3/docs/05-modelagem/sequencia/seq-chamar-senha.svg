    <rect x="560" y="438" width="201" height="16" fill="#fff"/>
    <text x="660" y="450" font-size="12" text-anchor="middle" fill="#222">buscar atendimento do operador</text>

    <line x1="740" y1="492" x2="900" y2="492" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="756" y="472" width="129" height="16" fill="#fff"/>
    <text x="820" y="484" font-size="12" text-anchor="middle" fill="#222">SELECT atendimento</text>

    <line x1="900" y1="526" x2="740" y2="526" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="795" y="506" width="50" height="16" fill="#fff"/>
    <text x="820" y="518" font-size="12" text-anchor="middle" fill="#222">nenhum</text>

