  <text x="16" y="1524" font-size="12" fill="#444">Legenda: seta cheia = chamada; seta tracejada = retorno; [guarda] = condição do alt.</text>
  <text x="16" y="1542" font-size="12" fill="#444">Finalizar aceita qualquer operador da instituição (não só o responsável). Cancelar aceita dono, operador ou admin.</text>
</svg>
