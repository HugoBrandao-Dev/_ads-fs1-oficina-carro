<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1560" width="1160" height="1560" font-family="sans-serif" role="img" aria-labelledby="seq-fincanc-t seq-fincanc-d">
  <title id="seq-fincanc-t">Sequência: finalizar ou cancelar atendimento (UC-11)</title>
  <desc id="seq-fincanc-d">Finalizar senha EM_ATENDIMENTO por POST /senhas/:id/finalizar (operador ou administrador da instituição) e cancelar senha AGUARDANDO por POST /senhas/:id/cancelar (dono, operador ou administrador). Cada ação tem fragmento alt interno com a guarda de sucesso e a guarda de erro (409 ou 403).</desc>
  <defs>
    <marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1160" height="1560" fill="#ffffff"/>

  <!-- Fragmento alt externo: finalizar ou cancelar -->
  <rect x="16" y="80" width="1128" height="1420" fill="none" stroke="#555"/>
  <rect x="16" y="80" width="40" height="18" fill="#1f4e9a"/>
  <text x="24" y="93" font-size="12" font-weight="bold" fill="#fff">alt</text>
  <text x="64" y="93" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[ação: finalizar atendimento]</text>
  <line x1="16" y1="808" x2="1144" y2="808" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="823" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: ação cancelar senha]</text>

  <!-- Fragmento alt interno: finalizar -->
  <rect x="34" y="306" width="1092" height="486" fill="none" stroke="#555"/>
  <rect x="34" y="306" width="40" height="18" fill="#555"/>
  <text x="42" y="319" font-size="12" font-weight="bold" fill="#fff">alt</text>
  <text x="82" y="319" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senha EM_ATENDIMENTO e mesma instituição]</text>
  <line x1="34" y1="672" x2="1126" y2="672" stroke="#555" stroke-dasharray="6 4"/>
  <text x="82" y="687" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: status diferente ou outra instituição]</text>

  <!-- Fragmento alt interno: cancelar -->
  <rect x="34" y="1008" width="1092" height="476" fill="none" stroke="#555"/>
  <rect x="34" y="1008" width="40" height="18" fill="#555"/>
  <text x="42" y="1021" font-size="12" font-weight="bold" fill="#fff">alt</text>
  <text x="82" y="1021" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senha AGUARDANDO e permissão: dono, operador ou admin da instituição]</text>
  <line x1="34" y1="1366" x2="1126" y2="1366" stroke="#555" stroke-dasharray="6 4"/>
  <text x="82" y="1381" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: 409 (status) ou 403 (sem permissão)]</text>

  <!-- Linhas de vida -->
  <g stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="64" x2="100" y2="1516"/>
    <line x1="260" y1="64" x2="260" y2="1516"/>
    <line x1="420" y1="64" x2="420" y2="1516"/>
    <line x1="580" y1="64" x2="580" y2="1516"/>
    <line x1="740" y1="64" x2="740" y2="1516"/>
    <line x1="900" y1="64" x2="900" y2="1516"/>
    <line x1="1060" y1="64" x2="1060" y2="1516"/>
  </g>

  <!-- Participantes -->
  <g stroke="#333" stroke-width="1" fill="#f2f2f2">
    <rect x="27" y="14" width="146" height="50" rx="4"/>
    <rect x="187" y="14" width="146" height="50" rx="4"/>
    <rect x="347" y="14" width="146" height="50" rx="4"/>
    <rect x="507" y="14" width="146" height="50" rx="4"/>
    <rect x="667" y="14" width="146" height="50" rx="4"/>
    <rect x="827" y="14" width="146" height="50" rx="4"/>
    <rect x="987" y="14" width="146" height="50" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="100" y="35" font-size="13" font-weight="bold">Ator</text>
    <text x="100" y="53" font-size="12" fill="#444">ACT-01, 02 ou 03</text>
    <text x="260" y="35" font-size="13" font-weight="bold">Express</text>
    <text x="260" y="53" font-size="12" fill="#444">rota + AuthMiddleware</text>
    <text x="420" y="35" font-size="13" font-weight="bold">SenhaController</text>
    <text x="420" y="53" font-size="12" fill="#444">repassa req.user</text>
    <text x="580" y="35" font-size="13" font-weight="bold">SenhaService</text>
    <text x="580" y="53" font-size="12" fill="#444">transições de estado</text>
    <text x="740" y="35" font-size="13" font-weight="bold">Repositórios</text>
    <text x="740" y="53" font-size="12" fill="#444">Senha, Auditoria</text>
    <text x="900" y="35" font-size="13" font-weight="bold">PostgreSQL</text>
    <text x="900" y="53" font-size="12" fill="#444">senhas, notificacoes</text>
    <text x="1060" y="35" font-size="13" font-weight="bold">Socket.IO</text>
    <text x="1060" y="53" font-size="12" fill="#444">EventBusService</text>
  </g>

  <!-- Ação 1: finalizar -->
  <g>
    <line x1="100" y1="120" x2="260" y2="120" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="89" y="100" width="182" height="16" fill="#fff"/>
    <text x="180" y="112" font-size="12" text-anchor="middle" fill="#222">POST /senhas/:id/finalizar</text>

    <line x1="260" y1="154" x2="420" y2="154" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="259" y="134" width="162" height="16" fill="#fff"/>
    <text x="340" y="146" font-size="12" text-anchor="middle" fill="#222">finalizar(id, req.user)</text>

    <line x1="420" y1="188" x2="580" y2="188" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="422" y="168" width="155" height="16" fill="#fff"/>
    <text x="500" y="180" font-size="12" text-anchor="middle" fill="#222">finalizar(id, usuario)</text>

