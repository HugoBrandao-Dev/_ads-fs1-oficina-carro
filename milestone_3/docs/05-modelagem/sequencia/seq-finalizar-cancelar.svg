    <rect x="576" y="390" width="168" height="16" fill="#fff"/>
    <text x="660" y="402" font-size="12" text-anchor="middle" fill="#222">registrar FINALIZAR_SENHA</text>

    <line x1="740" y1="444" x2="900" y2="444" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="759" y="424" width="122" height="16" fill="#fff"/>
    <text x="820" y="436" font-size="12" text-anchor="middle" fill="#222">INSERT auditorias</text>

    <line x1="580" y1="478" x2="1060" y2="478" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="762" y="458" width="116" height="16" fill="#fff"/>
    <text x="820" y="470" font-size="12" text-anchor="middle" fill="#222">senha:finalizada</text>

    <line x1="580" y1="512" x2="740" y2="512" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="536" y="492" width="248" height="16" fill="#fff"/>
    <text x="660" y="504" font-size="12" text-anchor="middle" fill="#222">criar notificação (SENHA_FINALIZADA)</text>

    <line x1="740" y1="546" x2="900" y2="546" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="752" y="526" width="135" height="16" fill="#fff"/>
    <text x="820" y="538" font-size="12" text-anchor="middle" fill="#222">INSERT notificacoes</text>

    <line x1="580" y1="580" x2="420" y2="580" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="442" y="560" width="116" height="16" fill="#fff"/>
    <text x="500" y="572" font-size="12" text-anchor="middle" fill="#222">senha finalizada</text>

    <line x1="420" y1="614" x2="260" y2="614" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="325" y="594" width="30" height="16" fill="#fff"/>
    <text x="340" y="606" font-size="12" text-anchor="middle" fill="#222">200</text>

    <line x1="260" y1="648" x2="100" y2="648" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="112" y="628" width="135" height="16" fill="#fff"/>
    <text x="180" y="640" font-size="12" text-anchor="middle" fill="#222">200 { data: senha }</text>
  </g>

  <g>
    <line x1="580" y1="710" x2="420" y2="710" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="462" y="690" width="76" height="16" fill="#fff"/>
    <text x="500" y="702" font-size="12" text-anchor="middle" fill="#222">409 ou 403</text>

    <line x1="420" y1="744" x2="260" y2="744" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="322" y="724" width="36" height="16" fill="#fff"/>
    <text x="340" y="736" font-size="12" text-anchor="middle" fill="#222">erro</text>

    <line x1="260" y1="778" x2="100" y2="778" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="162" y="758" width="36" height="16" fill="#fff"/>
    <text x="180" y="770" font-size="12" text-anchor="middle" fill="#222">erro</text>
  </g>

  <!-- Ação 2: cancelar -->
  <g>
    <line x1="100" y1="856" x2="260" y2="856" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="96" y="836" width="168" height="16" fill="#fff"/>
    <text x="180" y="848" font-size="12" text-anchor="middle" fill="#222">POST /senhas/:id/cancelar</text>

    <line x1="260" y1="890" x2="420" y2="890" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="266" y="870" width="149" height="16" fill="#fff"/>
    <text x="340" y="882" font-size="12" text-anchor="middle" fill="#222">cancelar(id, req.user)</text>

    <line x1="420" y1="924" x2="580" y2="924" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="429" y="904" width="142" height="16" fill="#fff"/>
    <text x="500" y="916" font-size="12" text-anchor="middle" fill="#222">cancelar(id, usuario)</text>

    <line x1="580" y1="958" x2="740" y2="958" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="606" y="938" width="109" height="16" fill="#fff"/>
    <text x="660" y="950" font-size="12" text-anchor="middle" fill="#222">buscarPorId(id)</text>

    <line x1="740" y1="992" x2="900" y2="992" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="776" y="972" width="89" height="16" fill="#fff"/>
    <text x="820" y="984" font-size="12" text-anchor="middle" fill="#222">SELECT senha</text>
  </g>

  <g>
