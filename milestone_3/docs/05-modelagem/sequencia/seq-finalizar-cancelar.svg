    <rect x="576" y="1092" width="168" height="16" fill="#fff"/>
    <text x="660" y="1104" font-size="12" text-anchor="middle" fill="#222">registrar CANCELAR_SENHA</text>

    <line x1="740" y1="1146" x2="900" y2="1146" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="759" y="1126" width="122" height="16" fill="#fff"/>
    <text x="820" y="1138" font-size="12" text-anchor="middle" fill="#222">INSERT auditorias</text>

    <line x1="580" y1="1180" x2="1060" y2="1180" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="762" y="1160" width="116" height="16" fill="#fff"/>
    <text x="820" y="1172" font-size="12" text-anchor="middle" fill="#222">senha:atualizada</text>

    <line x1="580" y1="1214" x2="740" y2="1214" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="543" y="1194" width="234" height="16" fill="#fff"/>
    <text x="660" y="1206" font-size="12" text-anchor="middle" fill="#222">criar notificação (SENHA_CANCELADA)</text>

