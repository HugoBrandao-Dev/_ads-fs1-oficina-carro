    <line x1="580" y1="342" x2="740" y2="342" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="588" y="322" width="145" height="16" fill="#fff"/>
    <text x="660" y="334" font-size="12" text-anchor="middle" fill="#222">atualizar(FINALIZADA)</text>

    <line x1="740" y1="376" x2="900" y2="376" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="772" y="356" width="96" height="16" fill="#fff"/>
    <text x="820" y="368" font-size="12" text-anchor="middle" fill="#222">UPDATE senhas</text>

