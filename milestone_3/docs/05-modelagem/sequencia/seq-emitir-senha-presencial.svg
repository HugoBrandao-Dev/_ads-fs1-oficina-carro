<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1040" width="1160" height="1040" font-family="sans-serif" role="img" aria-labelledby="seq-presencial-t seq-presencial-d">
  <title id="seq-presencial-t">Sequência: emitir senha presencial (UC-09)</title>
  <desc id="seq-presencial-d">Operador ou administrador da instituição cria senha para cidadão sem celular por POST /filas/:filaId/senhas/presencial. Passa por Express com AuthMiddleware, SenhaController, SenhaService, Repositórios e PostgreSQL, e emite senha:criada pelo Socket.IO. Fragmento alt com guardas: fila inválida ou inativa (400), fila de outra instituição (403), caminho de sucesso. Não há usuário vinculado nem QR Code.</desc>
  <defs>
    <marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1160" height="1040" fill="#ffffff"/>

  <!-- Fragmento alt -->
  <rect x="16" y="356" width="1128" height="632" fill="none" stroke="#555"/>
  <rect x="16" y="356" width="40" height="18" fill="#1f4e9a"/>
  <text x="24" y="369" font-size="12" font-weight="bold" fill="#fff">alt</text>
  <text x="64" y="369" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[fila inválida ou inativa]</text>
  <line x1="16" y1="476" x2="1144" y2="476" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="491" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: fila de outra instituição]</text>
  <line x1="16" y1="598" x2="1144" y2="598" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="613" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: fila válida da instituição do operador]</text>

  <!-- Linhas de vida -->
  <g stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="64" x2="100" y2="996"/>
    <line x1="260" y1="64" x2="260" y2="996"/>
    <line x1="420" y1="64" x2="420" y2="996"/>
    <line x1="580" y1="64" x2="580" y2="996"/>
    <line x1="740" y1="64" x2="740" y2="996"/>
    <line x1="900" y1="64" x2="900" y2="996"/>
    <line x1="1060" y1="64" x2="1060" y2="996"/>
  </g>

  <!-- Participantes -->
  <g stroke="#333" stroke-width="1" fill="#f2f2f2">
    <rect x="27" y="14" width="146" height="50" rx="4"/>
    <rect x="187" y="14" width="146" height="50" rx="4"/>
    <rect x="347" y="14" width="146" height="50" rx="4"/>
    <rect x="507" y="14" width="146" height="50" rx="4"/>
    <rect x="667" y="14" width="146" height="50" rx="4"/>
    <rect x="827" y="14" width="146" height="50" rx="4"/>
    <rect x="987" y="14" width="146" height="50" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="100" y="35" font-size="13" font-weight="bold">Operador</text>
    <text x="100" y="53" font-size="12" fill="#444">ACT-02 ou ACT-03</text>
    <text x="260" y="35" font-size="13" font-weight="bold">Express</text>
    <text x="260" y="53" font-size="12" fill="#444">rota + AuthMiddleware</text>
    <text x="420" y="35" font-size="13" font-weight="bold">SenhaController</text>
    <text x="420" y="53" font-size="12" fill="#444">valida body (zod)</text>
    <text x="580" y="35" font-size="13" font-weight="bold">SenhaService</text>
    <text x="580" y="53" font-size="12" fill="#444">regras de negócio</text>
    <text x="740" y="35" font-size="13" font-weight="bold">Repositórios</text>
    <text x="740" y="53" font-size="12" fill="#444">Fila, Senha, Auditoria</text>
    <text x="900" y="35" font-size="13" font-weight="bold">PostgreSQL</text>
    <text x="900" y="53" font-size="12" fill="#444">tabelas do domínio</text>
    <text x="1060" y="35" font-size="13" font-weight="bold">Socket.IO</text>
    <text x="1060" y="53" font-size="12" fill="#444">EventBusService</text>
  </g>

  <!-- Autorização no próprio Express (self-call) -->
  <path d="M260,130 H292 V146 H260" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
  <rect x="296" y="117" width="267" height="16" fill="#fff"/>
  <text x="300" y="129" font-size="12" fill="#222">authorize: ADMIN_INSTITUICAO ou OPERADOR</text>

  <!-- Caminho comum: entrada e consulta da fila -->
  <g>
    <line x1="100" y1="100" x2="260" y2="100" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="53" y="80" width="254" height="16" fill="#fff"/>
    <text x="180" y="92" font-size="12" text-anchor="middle" fill="#222">POST /filas/:filaId/senhas/presencial</text>

    <line x1="260" y1="170" x2="420" y2="170" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="233" y="150" width="214" height="16" fill="#fff"/>
    <text x="340" y="162" font-size="12" text-anchor="middle" fill="#222">criarPresencial(operador, body)</text>

    <line x1="420" y1="204" x2="580" y2="204" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="383" y="184" width="234" height="16" fill="#fff"/>
    <text x="500" y="196" font-size="12" text-anchor="middle" fill="#222">criarPresencial({ operador, ... })</text>

    <line x1="580" y1="238" x2="740" y2="238" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="593" y="218" width="135" height="16" fill="#fff"/>
    <text x="660" y="230" font-size="12" text-anchor="middle" fill="#222">buscarPorId(filaId)</text>

    <line x1="740" y1="272" x2="900" y2="272" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="779" y="252" width="83" height="16" fill="#fff"/>
    <text x="820" y="264" font-size="12" text-anchor="middle" fill="#222">SELECT fila</text>

    <line x1="900" y1="306" x2="740" y2="306" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="802" y="286" width="36" height="16" fill="#fff"/>
    <text x="820" y="298" font-size="12" text-anchor="middle" fill="#222">fila</text>

    <line x1="740" y1="340" x2="580" y2="340" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="642" y="320" width="36" height="16" fill="#fff"/>
    <text x="660" y="332" font-size="12" text-anchor="middle" fill="#222">fila</text>
  </g>

  <!-- Guarda 1: fila inválida ou inativa -->
  <g>
    <line x1="580" y1="392" x2="420" y2="392" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="439" y="372" width="122" height="16" fill="#fff"/>
    <text x="500" y="384" font-size="12" text-anchor="middle" fill="#222">400 Fila inválida</text>

    <line x1="420" y1="426" x2="260" y2="426" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="325" y="406" width="30" height="16" fill="#fff"/>
    <text x="340" y="418" font-size="12" text-anchor="middle" fill="#222">400</text>

    <line x1="260" y1="460" x2="100" y2="460" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="165" y="440" width="30" height="16" fill="#fff"/>
    <text x="180" y="452" font-size="12" text-anchor="middle" fill="#222">400</text>
  </g>

  <!-- Guarda 2: fila de outra instituição -->
  <g>
    <line x1="580" y1="514" x2="420" y2="514" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="400" y="494" width="201" height="16" fill="#fff"/>
    <text x="500" y="506" font-size="12" text-anchor="middle" fill="#222">403 Fila de outra instituição</text>

    <line x1="420" y1="548" x2="260" y2="548" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="325" y="528" width="30" height="16" fill="#fff"/>
    <text x="340" y="540" font-size="12" text-anchor="middle" fill="#222">403</text>

    <line x1="260" y1="582" x2="100" y2="582" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="165" y="562" width="30" height="16" fill="#fff"/>
    <text x="180" y="574" font-size="12" text-anchor="middle" fill="#222">403</text>
  </g>

  <!-- Guarda 3: caminho de sucesso -->
  <g>
    <line x1="580" y1="632" x2="740" y2="632" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="573" y="612" width="175" height="16" fill="#fff"/>
    <text x="660" y="624" font-size="12" text-anchor="middle" fill="#222">calcular posição e número</text>

    <line x1="740" y1="666" x2="900" y2="666" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="726" y="646" width="188" height="16" fill="#fff"/>
    <text x="820" y="658" font-size="12" text-anchor="middle" fill="#222">SELECT max(posicao, numero)</text>

    <line x1="900" y1="700" x2="740" y2="700" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="762" y="680" width="116" height="16" fill="#fff"/>
    <text x="820" y="692" font-size="12" text-anchor="middle" fill="#222">posição e número</text>

    <line x1="580" y1="734" x2="740" y2="734" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="576" y="714" width="168" height="16" fill="#fff"/>
    <text x="660" y="726" font-size="12" text-anchor="middle" fill="#222">criar(senha sem usuário)</text>

    <line x1="740" y1="768" x2="900" y2="768" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="729" y="748" width="182" height="16" fill="#fff"/>
    <text x="820" y="760" font-size="12" text-anchor="middle" fill="#222">INSERT senhas (presencial)</text>

    <line x1="580" y1="802" x2="740" y2="802" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="592" y="782" width="135" height="16" fill="#fff"/>
    <text x="660" y="794" font-size="12" text-anchor="middle" fill="#222">registrar auditoria</text>

    <line x1="740" y1="836" x2="900" y2="836" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="759" y="816" width="122" height="16" fill="#fff"/>
    <text x="820" y="828" font-size="12" text-anchor="middle" fill="#222">INSERT auditorias</text>

    <line x1="580" y1="870" x2="1060" y2="870" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="776" y="850" width="89" height="16" fill="#fff"/>
    <text x="820" y="862" font-size="12" text-anchor="middle" fill="#222">senha:criada</text>

    <line x1="580" y1="904" x2="420" y2="904" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="456" y="884" width="89" height="16" fill="#fff"/>
    <text x="500" y="896" font-size="12" text-anchor="middle" fill="#222">senha criada</text>

    <line x1="420" y1="938" x2="260" y2="938" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="325" y="918" width="30" height="16" fill="#fff"/>
    <text x="340" y="930" font-size="12" text-anchor="middle" fill="#222">201</text>

    <line x1="260" y1="972" x2="100" y2="972" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="116" y="952" width="129" height="16" fill="#fff"/>
    <text x="180" y="964" font-size="12" text-anchor="middle" fill="#222">201 { data: senha }</text>
  </g>

  <text x="16" y="1020" font-size="12" fill="#444">Legenda: seta cheia = chamada; seta tracejada = retorno; [guarda] = condição do alt.</text>
  <text x="16" y="1036" font-size="12" fill="#444">Sem QR Code e sem usuário vinculado (RF-038): a senha fica com nome do cidadão e presencial = true.</text>
</svg>
