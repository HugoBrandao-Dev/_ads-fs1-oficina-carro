<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1140" width="1060" height="1140" font-family="sans-serif" role="img" aria-labelledby="seq-login-t seq-login-d">
  <title id="seq-login-t">Sequência: autenticação com BetterAuth (sign-in e sessão)</title>
  <desc id="seq-login-d">Login por e-mail e senha (POST /api/auth/sign-in/email) e verificação de sessão em rota protegida (GET /auth/me). Participantes: Cidadão, Express, AuthMiddleware, BetterAuth e PostgreSQL. Fragmentos alt com guardas: credenciais válidas ou inválidas, sessão ausente ou válida, usuário inativo ou ativo.</desc>
  <defs>
    <marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1060" height="1140" fill="#ffffff"/>

  <!-- Fragmentos -->
  <g fill="none" stroke="#555" stroke-width="1">
    <rect x="16" y="222" width="1028" height="256"/>
    <rect x="16" y="696" width="1028" height="396"/>
    <rect x="34" y="906" width="992" height="172"/>
  </g>
  <rect x="16" y="222" width="40" height="18" fill="#1f4e9a"/>
  <rect x="16" y="696" width="40" height="18" fill="#1f4e9a"/>
  <rect x="34" y="906" width="40" height="18" fill="#555"/>
  <text x="24" y="235" font-size="12" font-weight="bold" fill="#fff">alt</text>
  <text x="24" y="709" font-size="12" font-weight="bold" fill="#fff">alt</text>
  <text x="42" y="919" font-size="12" font-weight="bold" fill="#fff">alt</text>
  <text x="64" y="235" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[credenciais conferem]</text>
  <line x1="16" y1="386" x2="1044" y2="386" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="401" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: senha inválida ou limite por IP]</text>
  <text x="64" y="709" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[sessão ausente ou expirada]</text>
  <line x1="16" y1="818" x2="1044" y2="818" stroke="#555" stroke-dasharray="6 4"/>
  <text x="64" y="833" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: sessão válida]</text>
  <text x="82" y="919" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[usuário inativo]</text>
  <line x1="34" y1="992" x2="1026" y2="992" stroke="#555" stroke-dasharray="6 4"/>
  <text x="82" y="1007" font-size="12" font-style="italic" fill="#222" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[senão: usuário ativo]</text>

  <!-- Separador de trecho -->
  <line x1="16" y1="500" x2="1044" y2="500" stroke="#999" stroke-dasharray="2 3"/>
  <text x="24" y="518" font-size="13" font-weight="bold" fill="#333" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Requisição autenticada: GET /auth/me</text>

  <!-- Linhas de vida -->
  <g stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4">
    <line x1="110" y1="64" x2="110" y2="1096"/>
    <line x1="320" y1="64" x2="320" y2="1096"/>
    <line x1="530" y1="64" x2="530" y2="1096"/>
    <line x1="740" y1="64" x2="740" y2="1096"/>
    <line x1="950" y1="64" x2="950" y2="1096"/>
  </g>

  <!-- Participantes -->
  <g stroke="#333" stroke-width="1" fill="#f2f2f2">
    <rect x="20" y="14" width="180" height="50" rx="4"/>
    <rect x="230" y="14" width="180" height="50" rx="4"/>
    <rect x="440" y="14" width="180" height="50" rx="4"/>
    <rect x="650" y="14" width="180" height="50" rx="4"/>
    <rect x="860" y="14" width="180" height="50" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="110" y="35" font-size="13" font-weight="bold">Cidadão</text>
    <text x="110" y="53" font-size="12" fill="#444">ACT-01 · cliente HTTP</text>
    <text x="320" y="35" font-size="13" font-weight="bold">Express</text>
    <text x="320" y="53" font-size="12" fill="#444">rotas /api/auth e /auth</text>
    <text x="530" y="35" font-size="13" font-weight="bold">AuthMiddleware</text>
    <text x="530" y="53" font-size="12" fill="#444">req.user</text>
    <text x="740" y="35" font-size="13" font-weight="bold">BetterAuth</text>
    <text x="740" y="53" font-size="12" fill="#444">config/auth.js</text>
    <text x="950" y="35" font-size="13" font-weight="bold">PostgreSQL</text>
    <text x="950" y="53" font-size="12" fill="#444">users, sessions</text>
  </g>

  <!-- Mensagens: sign-in -->
  <g>
    <line x1="110" y1="100" x2="320" y2="100" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="118" y="80" width="195" height="16" fill="#fff"/>
    <text x="215" y="92" font-size="12" text-anchor="middle" fill="#222">POST /api/auth/sign-in/email</text>

    <line x1="320" y1="134" x2="740" y2="134" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="463" y="114" width="135" height="16" fill="#fff"/>
    <text x="530" y="126" font-size="12" text-anchor="middle" fill="#222">toNodeHandler(auth)</text>

    <line x1="740" y1="168" x2="950" y2="168" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="774" y="148" width="142" height="16" fill="#fff"/>
    <text x="845" y="160" font-size="12" text-anchor="middle" fill="#222">busca user e account</text>

    <line x1="950" y1="202" x2="740" y2="202" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="764" y="182" width="162" height="16" fill="#fff"/>
    <text x="845" y="194" font-size="12" text-anchor="middle" fill="#222">usuário e hash da senha</text>

    <line x1="740" y1="262" x2="950" y2="262" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="761" y="242" width="168" height="16" fill="#fff"/>
    <text x="845" y="254" font-size="12" text-anchor="middle" fill="#222">INSERT sessions (7 dias)</text>

    <line x1="950" y1="296" x2="740" y2="296" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="794" y="276" width="102" height="16" fill="#fff"/>
    <text x="845" y="288" font-size="12" text-anchor="middle" fill="#222">sessão gravada</text>

    <line x1="740" y1="330" x2="320" y2="330" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="420" y="310" width="221" height="16" fill="#fff"/>
    <text x="530" y="322" font-size="12" text-anchor="middle" fill="#222">200 + Set-Cookie e set-auth-token</text>

    <line x1="320" y1="364" x2="110" y2="364" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="121" y="344" width="188" height="16" fill="#fff"/>
    <text x="215" y="356" font-size="12" text-anchor="middle" fill="#222">200 { user, session, token }</text>

    <line x1="740" y1="428" x2="320" y2="428" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="439" y="408" width="182" height="16" fill="#fff"/>
    <text x="530" y="420" font-size="12" text-anchor="middle" fill="#222">401 ou 429 (limite por IP)</text>

    <line x1="320" y1="462" x2="110" y2="462" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="144" y="442" width="142" height="16" fill="#fff"/>
    <text x="215" y="454" font-size="12" text-anchor="middle" fill="#222">erro de autenticação</text>
  </g>

  <!-- Mensagens: sessão -->
  <g>
    <line x1="110" y1="544" x2="320" y2="544" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="107" y="524" width="215" height="16" fill="#fff"/>
    <text x="215" y="536" font-size="12" text-anchor="middle" fill="#222">GET /auth/me (cookie ou Bearer)</text>

    <line x1="320" y1="578" x2="530" y2="578" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="358" y="558" width="135" height="16" fill="#fff"/>
    <text x="425" y="570" font-size="12" text-anchor="middle" fill="#222">AuthMiddleware(req)</text>

    <line x1="530" y1="612" x2="740" y2="612" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="538" y="592" width="195" height="16" fill="#fff"/>
    <text x="635" y="604" font-size="12" text-anchor="middle" fill="#222">auth.api.getSession(headers)</text>

    <line x1="740" y1="646" x2="950" y2="646" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="787" y="626" width="116" height="16" fill="#fff"/>
    <text x="845" y="638" font-size="12" text-anchor="middle" fill="#222">sessão e usuário</text>

    <line x1="950" y1="680" x2="740" y2="680" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="794" y="660" width="102" height="16" fill="#fff"/>
    <text x="845" y="672" font-size="12" text-anchor="middle" fill="#222">sessão ou nula</text>
  </g>

  <!-- Mensagens: sessão ausente (alt B1) -->
  <g>
    <line x1="740" y1="732" x2="530" y2="732" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="617" y="712" width="36" height="16" fill="#fff"/>
    <text x="635" y="724" font-size="12" text-anchor="middle" fill="#222">null</text>

    <line x1="530" y1="766" x2="320" y2="766" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="358" y="746" width="135" height="16" fill="#fff"/>
    <text x="425" y="758" font-size="12" text-anchor="middle" fill="#222">498 Sessão inválida</text>

    <line x1="320" y1="800" x2="110" y2="800" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="200" y="780" width="30" height="16" fill="#fff"/>
    <text x="215" y="792" font-size="12" text-anchor="middle" fill="#222">498</text>
  </g>

  <!-- Mensagens: sessão válida (alt B2) -->
  <g>
    <line x1="530" y1="856" x2="950" y2="856" stroke="#222" stroke-width="1.2" marker-end="url(#sync)"/>
    <rect x="656" y="836" width="168" height="16" fill="#fff"/>
    <text x="740" y="848" font-size="12" text-anchor="middle" fill="#222">findUnique(user, papeis)</text>

    <line x1="950" y1="890" x2="530" y2="890" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="682" y="870" width="116" height="16" fill="#fff"/>
    <text x="740" y="882" font-size="12" text-anchor="middle" fill="#222">usuário e papéis</text>

    <line x1="530" y1="942" x2="320" y2="942" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="358" y="922" width="135" height="16" fill="#fff"/>
    <text x="425" y="934" font-size="12" text-anchor="middle" fill="#222">403 Usuário inativo</text>

    <line x1="320" y1="976" x2="110" y2="976" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="200" y="956" width="30" height="16" fill="#fff"/>
    <text x="215" y="968" font-size="12" text-anchor="middle" fill="#222">403</text>

    <line x1="530" y1="1030" x2="320" y2="1030" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="328" y="1010" width="195" height="16" fill="#fff"/>
    <text x="425" y="1022" font-size="12" text-anchor="middle" fill="#222">req.user = {id, papeis, ...}</text>

    <line x1="320" y1="1064" x2="110" y2="1064" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ret)"/>
    <rect x="138" y="1044" width="155" height="16" fill="#fff"/>
    <text x="215" y="1056" font-size="12" text-anchor="middle" fill="#222">200 { data: req.user }</text>
  </g>

  <text x="16" y="1124" font-size="12" fill="#444">Legenda: seta cheia = chamada; seta tracejada = retorno; [guarda] = condição do fragmento alt.</text>
</svg>
