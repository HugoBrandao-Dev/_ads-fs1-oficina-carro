<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" font-family="sans-serif">
  <title>Diagrama de atividades: solicitação e avaliação de instituição</title>
  <desc>Diagrama de atividades com quatro raias: Solicitante (ACT-01 ou usuário autenticado), Sistema, Administrador da Plataforma (ACT-04) e Administrador da Instituição (ACT-03). Mostra a solicitação de cadastro, a avaliação pelo administrador da plataforma (aprovar ou rejeitar) e a criação do administrador da instituição após a aprovação. A linha azul é o caminho principal; a cinza, a rejeição.</desc>
  <defs>
    <marker id="seta-azul" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="seta-cinza" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Raias -->
  <rect x="0" y="20" width="1300" height="170" fill="#ffffff" stroke="#9a9a9a"/>
  <rect x="0" y="190" width="1300" height="170" fill="#f4f4f4" stroke="#9a9a9a"/>
  <rect x="0" y="360" width="1300" height="170" fill="#ffffff" stroke="#9a9a9a"/>
  <rect x="0" y="530" width="1300" height="170" fill="#f4f4f4" stroke="#9a9a9a"/>
  <rect x="0" y="20" width="150" height="170" fill="#e4e4e4" stroke="#9a9a9a"/>
  <rect x="0" y="190" width="150" height="170" fill="#dcdcdc" stroke="#9a9a9a"/>
  <rect x="0" y="360" width="150" height="170" fill="#e4e4e4" stroke="#9a9a9a"/>
  <rect x="0" y="530" width="150" height="170" fill="#dcdcdc" stroke="#9a9a9a"/>

  <text x="75" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Solicitante</text>
  <text x="75" y="118" text-anchor="middle" font-size="12" fill="#333">ACT-01</text>
  <text x="75" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Sistema</text>
  <text x="75" y="288" text-anchor="middle" font-size="12" fill="#333">API</text>
  <text x="75" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Administrador</text>
  <text x="75" y="458" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">da Plataforma</text>
  <text x="75" y="476" text-anchor="middle" font-size="12" fill="#333">ACT-04</text>
  <text x="75" y="600" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Administrador</text>
  <text x="75" y="618" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">da Instituição</text>
  <text x="75" y="636" text-anchor="middle" font-size="12" fill="#333">ACT-03</text>

  <!-- Nos inicial e final -->
  <circle cx="185" cy="105" r="10" fill="#1f5fa8"/>
  <circle cx="960" cy="500" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="960" cy="500" r="7" fill="#333"/>
  <circle cx="1170" cy="680" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="1170" cy="680" r="7" fill="#333"/>

  <!-- Acoes -->
  <g fill="#ffffff" stroke="#555" stroke-width="1.2">
    <rect x="215" y="80" width="170" height="50" rx="4"/>
    <rect x="435" y="250" width="170" height="50" rx="4"/>
    <rect x="435" y="420" width="170" height="50" rx="4"/>
    <rect x="655" y="250" width="170" height="50" rx="4"/>
    <rect x="875" y="420" width="170" height="50" rx="4"/>
    <rect x="1085" y="420" width="170" height="50" rx="4"/>
    <rect x="1085" y="590" width="170" height="50" rx="4"/>
  </g>

  <!-- Decisao -->
  <polygon points="740,410 795,445 740,480 685,445" fill="#ffffff" stroke="#555" stroke-width="1.2"/>

  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="300" y="100">Preenche a solicitação</text>
    <text x="300" y="116">(UC-03)</text>
    <text x="520" y="270">Valida dados e cria</text>
    <text x="520" y="286">instituição PENDENTE</text>
    <text x="520" y="440">Analisa a solicitação</text>
    <text x="520" y="456">(UC-04)</text>
    <text x="740" y="270">Aprova: APROVADA;</text>
    <text x="740" y="286">ativa e notifica</text>
    <text x="740" y="450">Aprova?</text>
    <text x="960" y="440">Rejeita com motivo</text>
    <text x="960" y="456">status REJEITADA</text>
    <text x="1170" y="440">Cadastra administrador</text>
    <text x="1170" y="456">da instituição</text>
    <text x="1170" y="610">Acessa a instituição</text>
    <text x="1170" y="626">com a conta criada</text>
  </g>

  <!-- Fluxos: caminho principal em azul -->
  <g fill="none" stroke="#1f5fa8" stroke-width="1.6">
    <path d="M195 105 H215" marker-end="url(#seta-azul)"/>
    <path d="M385 105 H410 V275 H433" marker-end="url(#seta-azul)"/>
    <path d="M520 300 V417" marker-end="url(#seta-azul)"/>
    <path d="M605 445 H683" marker-end="url(#seta-azul)"/>
    <path d="M740 410 V302" marker-end="url(#seta-azul)"/>
    <path d="M825 275 H1170 V418" marker-end="url(#seta-azul)"/>
    <path d="M1170 470 V588" marker-end="url(#seta-azul)"/>
    <path d="M1170 640 V666" marker-end="url(#seta-azul)"/>
  </g>

  <!-- Fluxos: rejeicao em cinza -->
  <g fill="none" stroke="#555555" stroke-width="1.6">
    <path d="M795 445 H873" marker-end="url(#seta-cinza)"/>
    <path d="M960 470 V486"/>
  </g>

  <!-- Rotulos -->
  <g font-size="12" fill="#333">
    <text x="750" y="368">sim</text>
    <text x="805" y="436">não</text>
    <text x="900" y="266">aprovada: ativa e notifica</text>
    <text x="880" y="524">reconsiderar volta a PENDENTE</text>
  </g>
</svg>
