<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" font-family="sans-serif">
  <title>Diagrama de atividades: atendimento de uma senha</title>
  <desc>Diagrama de atividades com quatro raias: Cidadão (ACT-01), Sistema, Operador (ACT-02) e Administrador da Instituição (ACT-03). Mostra a emissão da senha (online ou presencial), a chamada, o atendimento e a finalização ou o cancelamento. A linha azul é o caminho principal; a cinza, o cancelamento e a assunção de atendimento.</desc>
  <defs>
    <marker id="seta-azul" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="seta-cinza" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Raias -->
  <rect x="0" y="20" width="1300" height="170" fill="#ffffff" stroke="#9a9a9a"/>
  <rect x="0" y="190" width="1300" height="170" fill="#f4f4f4" stroke="#9a9a9a"/>
  <rect x="0" y="360" width="1300" height="170" fill="#ffffff" stroke="#9a9a9a"/>
  <rect x="0" y="530" width="1300" height="170" fill="#f4f4f4" stroke="#9a9a9a"/>
  <rect x="0" y="20" width="150" height="170" fill="#e4e4e4" stroke="#9a9a9a"/>
  <rect x="0" y="190" width="150" height="170" fill="#dcdcdc" stroke="#9a9a9a"/>
  <rect x="0" y="360" width="150" height="170" fill="#e4e4e4" stroke="#9a9a9a"/>
  <rect x="0" y="530" width="150" height="170" fill="#dcdcdc" stroke="#9a9a9a"/>

  <text x="75" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Cidadão</text>
  <text x="75" y="118" text-anchor="middle" font-size="12" fill="#333">ACT-01</text>
  <text x="75" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Sistema</text>
  <text x="75" y="288" text-anchor="middle" font-size="12" fill="#333">API</text>
  <text x="75" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Operador</text>
  <text x="75" y="458" text-anchor="middle" font-size="12" fill="#333">ACT-02</text>
  <text x="75" y="600" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Administrador</text>
  <text x="75" y="618" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">da Instituição</text>
  <text x="75" y="636" text-anchor="middle" font-size="12" fill="#333">ACT-03</text>

  <!-- Nos inicial e final -->
  <circle cx="185" cy="105" r="10" fill="#1f5fa8"/>
  <circle cx="185" cy="445" r="10" fill="#1f5fa8"/>
  <circle cx="740" cy="345" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="740" cy="345" r="7" fill="#333"/>
  <circle cx="1170" cy="345" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="1170" cy="345" r="7" fill="#333"/>

  <!-- Acoes -->
  <g fill="#ffffff" stroke="#555" stroke-width="1.2">
    <rect x="215" y="80" width="170" height="50" rx="4"/>
    <rect x="215" y="420" width="170" height="50" rx="4"/>
    <rect x="655" y="80" width="170" height="50" rx="4"/>
    <rect x="435" y="250" width="170" height="50" rx="4"/>
    <rect x="655" y="250" width="170" height="50" rx="4"/>
    <rect x="875" y="250" width="170" height="50" rx="4"/>
    <rect x="1085" y="250" width="170" height="50" rx="4"/>
    <rect x="435" y="420" width="170" height="50" rx="4"/>
    <rect x="875" y="420" width="170" height="50" rx="4"/>
    <rect x="1085" y="420" width="170" height="50" rx="4"/>
    <rect x="875" y="590" width="170" height="50" rx="4"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="300" y="100">Retira senha online</text>
    <text x="300" y="116">(UC-08)</text>
    <text x="300" y="440">Emite senha presencial</text>
    <text x="300" y="456">(UC-09)</text>
    <text x="740" y="100">Acompanha fila e</text>
    <text x="740" y="116">cancela (UC-15)</text>
    <text x="520" y="270">Valida fila e QR; cria</text>
    <text x="520" y="286">senha AGUARDANDO</text>
    <text x="740" y="270">Marca CANCELADA;</text>
    <text x="740" y="286">notifica o cidadão</text>
    <text x="960" y="270">Marca EM_ATENDIMENTO</text>
    <text x="960" y="286">e exibe a chamada</text>
    <text x="1170" y="270">Marca FINALIZADA;</text>
    <text x="1170" y="286">grava auditoria</text>
    <text x="520" y="440">Chama próxima senha</text>
    <text x="520" y="456">(UC-10)</text>
    <text x="960" y="440">Atende; rechama</text>
    <text x="960" y="456">se necessário</text>
    <text x="1170" y="440">Finaliza atendimento</text>
    <text x="1170" y="456">(UC-11)</text>
    <text x="960" y="610">Assume atendimento</text>
    <text x="960" y="626">de outro operador</text>
  </g>

  <!-- Fluxos: caminho principal em azul -->
  <g fill="none" stroke="#1f5fa8" stroke-width="1.6">
    <path d="M197 105 H215" marker-end="url(#seta-azul)"/>
    <path d="M385 105 H410 V275 H433" marker-end="url(#seta-azul)"/>
    <path d="M197 445 H215" marker-end="url(#seta-azul)"/>
    <path d="M385 445 H410 V275 H433" marker-end="url(#seta-azul)"/>
    <path d="M520 250 V105 H653" marker-end="url(#seta-azul)"/>
    <path d="M520 300 V417" marker-end="url(#seta-azul)"/>
    <path d="M605 445 H840 V275 H873" marker-end="url(#seta-azul)"/>
    <path d="M960 300 V417" marker-end="url(#seta-azul)"/>
    <path d="M1045 445 H1083" marker-end="url(#seta-azul)"/>
    <path d="M1110 420 V302" marker-end="url(#seta-azul)"/>
    <path d="M1170 300 V331" marker-end="url(#seta-azul)"/>
  </g>

  <!-- Fluxos: cancelamento e assuncao em cinza -->
  <g fill="none" stroke="#555555" stroke-width="1.6">
    <path d="M740 130 V248" marker-end="url(#seta-cinza)"/>
    <path d="M740 300 V331" marker-end="url(#seta-cinza)"/>
    <path d="M960 590 V472" stroke-dasharray="6 4" marker-end="url(#seta-cinza)"/>
  </g>

  <!-- Rotulos de guarda e de evento -->
  <g font-size="12" fill="#333">
    <text x="750" y="172">cancela só em AGUARDANDO</text>
    <text x="528" y="346">próxima senha AGUARDANDO</text>
    <text x="640" y="436">operador livre e mesa livre</text>
    <text x="968" y="372">EM_ATENDIMENTO</text>
    <text x="1178" y="372">finalizar</text>
    <text x="968" y="508">assumir: troca o operador</text>
    <text x="968" y="524">senha segue EM_ATENDIMENTO</text>
  </g>
</svg>
