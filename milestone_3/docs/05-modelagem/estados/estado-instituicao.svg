<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" font-family="sans-serif">
  <title>Máquina de estados da Instituição (StatusInstituicao)</title>
  <desc>Estados do enum StatusInstituicao do banco: PENDENTE, APROVADA e REJEITADA. A solicitação pública entra em PENDENTE; a criação direta pelo administrador da plataforma entra em APROVADA. As transições são nomeadas pelo evento (aprovação, rejeição, reconsideração) e trazem a guarda entre colchetes.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Pseudoestados iniciais -->
  <circle cx="90" cy="335" r="10" fill="#333333"/>
  <circle cx="830" cy="200" r="10" fill="#333333"/>

  <!-- Estados -->
  <g fill="#ffffff" stroke="#555" stroke-width="1.4">
    <rect x="330" y="300" width="200" height="70" rx="8"/>
    <rect x="730" y="300" width="200" height="70" rx="8"/>
    <rect x="330" y="495" width="200" height="70" rx="8"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="430" y="341">PENDENTE</text>
    <text x="830" y="341">APROVADA</text>
    <text x="430" y="536">REJEITADA</text>
  </g>

  <!-- Transicoes -->
  <g fill="none" stroke="#333" stroke-width="1.5">
    <path d="M100 335 H328" marker-end="url(#seta)"/>
    <path d="M530 335 H728" marker-end="url(#seta)"/>
    <path d="M400 370 V493" marker-end="url(#seta)"/>
    <path d="M460 495 V372" marker-end="url(#seta)"/>
    <path d="M530 530 H830 V372" marker-end="url(#seta)"/>
    <path d="M830 210 V298" marker-end="url(#seta)"/>
  </g>

  <!-- Rotulos: evento em negrito, guarda abaixo -->
  <g font-size="13" fill="#222">
    <text x="214" y="318" text-anchor="middle" font-weight="bold">solicitação</text>
    <text x="214" y="354" text-anchor="middle" font-size="11" fill="#444">[ativo = false]</text>
    <text x="630" y="318" text-anchor="middle" font-weight="bold">aprovação</text>
    <text x="630" y="354" text-anchor="middle" font-size="11" fill="#444">[AP; ativo = true]</text>
    <text x="390" y="432" text-anchor="end" font-weight="bold">rejeição</text>
    <text x="390" y="448" text-anchor="end" font-size="11" fill="#444">[AP; com motivoRejeicao]</text>
    <text x="470" y="432" text-anchor="start" font-weight="bold">reconsideração</text>
    <text x="470" y="448" text-anchor="start" font-size="11" fill="#444">[AP; limpa motivo e aprovador]</text>
    <text x="680" y="522" text-anchor="middle" font-weight="bold">aprovação</text>
    <text x="680" y="548" text-anchor="middle" font-size="11" fill="#444">[AP; a partir de REJEITADA]</text>
    <text x="845" y="250" text-anchor="start" font-weight="bold">criação direta</text>
    <text x="845" y="266" text-anchor="start" font-size="11" fill="#444">[POST /instituicoes; AP]</text>
  </g>

  <!-- Observacoes -->
  <g font-size="11" fill="#555">
    <text x="955" y="330">APROVADA não tem transição de saída de status.</text>
    <text x="955" y="346">O campo ativo muda à parte (PUT /instituicoes/:id).</text>
    <text x="60" y="610">Exclusão (DELETE /instituicoes/:id) remove o registro em qualquer estado; não é transição de status.</text>
  </g>
</svg>
