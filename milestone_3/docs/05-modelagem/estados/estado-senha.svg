<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" font-family="sans-serif">
  <title>Máquina de estados da Senha (StatusSenha)</title>
  <desc>Estados do enum StatusSenha do banco: AGUARDANDO, EM_ATENDIMENTO, CANCELADA e FINALIZADA. As transições são nomeadas pelo evento que as dispara (emissão, chamada, cancelamento, finalização, encaminhamento de flow e assunção de atendimento), com a guarda entre colchetes. A rechamada não muda o estado e não aparece no desenho.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Pseudoestados inicial e final -->
  <circle cx="90" cy="300" r="10" fill="#333333"/>
  <circle cx="270" cy="600" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="270" cy="600" r="7" fill="#333"/>
  <circle cx="1265" cy="300" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="1265" cy="300" r="7" fill="#333"/>

  <!-- Estados -->
  <g fill="#ffffff" stroke="#555" stroke-width="1.4">
    <rect x="170" y="265" width="200" height="70" rx="8"/>
    <rect x="560" y="265" width="220" height="70" rx="8"/>
    <rect x="990" y="265" width="200" height="70" rx="8"/>
    <rect x="170" y="470" width="200" height="70" rx="8"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="270" y="306">AGUARDANDO</text>
    <text x="670" y="306">EM_ATENDIMENTO</text>
    <text x="1090" y="306">FINALIZADA</text>
    <text x="270" y="511">CANCELADA</text>
  </g>

  <!-- Transicoes -->
  <g fill="none" stroke="#333" stroke-width="1.5">
    <path d="M100 300 H168" marker-end="url(#seta)"/>
    <path d="M370 300 H558" marker-end="url(#seta)"/>
    <path d="M780 300 H988" marker-end="url(#seta)"/>
    <path d="M1190 300 H1251" marker-end="url(#seta)"/>
    <path d="M270 335 V468" marker-end="url(#seta)"/>
    <path d="M270 540 V586"/>
    <path d="M670 265 V180 H270 V263" marker-end="url(#seta)"/>
    <path d="M620 335 Q670 395 720 335" marker-end="url(#seta)"/>
  </g>

  <!-- Rotulos: evento em negrito, guarda abaixo -->
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="135" y="286">emissão</text>
    <text x="464" y="284" font-weight="bold">chamada</text>
    <text x="464" y="322" font-size="11" fill="#444">[operador ou admin da instituição]</text>
    <text x="884" y="284" font-weight="bold">finalização</text>
    <text x="884" y="322" font-size="11" fill="#444">[mesma instituição]</text>
    <text x="470" y="166" font-weight="bold">encaminhamento de flow</text>
    <text x="470" y="198" font-size="11" fill="#444">[sem verificação de StatusSenha: ver divergências]</text>
    <text x="670" y="392" font-weight="bold">assunção de atendimento</text>
    <text x="670" y="408" font-size="11" fill="#444">[admin da instituição; outro operador]</text>
  </g>
  <g font-size="13" text-anchor="start" fill="#222">
    <text x="300" y="418" font-weight="bold">cancelamento</text>
    <text x="300" y="434" font-size="11" fill="#444">[só em AGUARDANDO; dono, admin ou operador</text>
    <text x="300" y="448" font-size="11" fill="#444">da instituição, ou admin da plataforma]</text>
  </g>
  <text x="560" y="540" font-size="11" fill="#555">Rechamada (rechamar) não muda o estado.</text>
</svg>
