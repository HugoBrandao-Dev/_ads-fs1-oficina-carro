<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" font-family="sans-serif">
  <title>Máquina de estados do acompanhamento de flow (SenhaFlowStatus)</title>
  <desc>Estados do enum SenhaFlowStatus, usado por SenhaFlowTracking: EM_ANDAMENTO, CONCLUIDO e CANCELADO. A alta conclui o acompanhamento; o encaminhamento permanece em EM_ANDAMENTO. O estado CANCELADO existe no enum, mas nenhum método do código o grava: a transição tracejada é uma lacuna registrada em divergências.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="seta-cinza" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777777"/>
    </marker>
  </defs>

  <!-- Pseudoestados -->
  <circle cx="90" cy="300" r="10" fill="#333333"/>
  <circle cx="1200" cy="300" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="1200" cy="300" r="7" fill="#333"/>
  <circle cx="440" cy="600" r="12" fill="#ffffff" stroke="#777" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="440" cy="600" r="7" fill="#777"/>

  <!-- Estados -->
  <g fill="#ffffff" stroke="#555" stroke-width="1.4">
    <rect x="330" y="265" width="220" height="70" rx="8"/>
    <rect x="850" y="265" width="220" height="70" rx="8"/>
  </g>
  <rect x="330" y="470" width="220" height="70" rx="8" fill="#ffffff" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/>
  <g font-size="15" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="440" y="306">EM_ANDAMENTO</text>
    <text x="960" y="306">CONCLUIDO</text>
  </g>
  <text x="440" y="511" font-size="15" font-weight="bold" fill="#777" text-anchor="middle">CANCELADO</text>

  <!-- Transicoes -->
  <g fill="none" stroke="#333" stroke-width="1.5">
    <path d="M100 300 H328" marker-end="url(#seta)"/>
    <path d="M550 300 H848" marker-end="url(#seta)"/>
    <path d="M1070 300 H1186" marker-end="url(#seta)"/>
    <path d="M400 265 V230 H480 V263" marker-end="url(#seta)"/>
  </g>
  <g fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="6 4">
    <path d="M440 335 V468" marker-end="url(#seta-cinza)"/>
    <path d="M440 540 V586"/>
  </g>

  <!-- Rotulos -->
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="214" y="284" font-weight="bold">ingresso no flow</text>
    <text x="214" y="320" font-size="11" fill="#444">[senha sem flow ativo]</text>
    <text x="700" y="284" font-weight="bold">alta</text>
    <text x="700" y="320" font-size="11" fill="#444">[tracking EM_ANDAMENTO; finaliza a senha]</text>
    <text x="440" y="196" font-weight="bold">encaminhamento</text>
    <text x="440" y="214" font-size="11" fill="#444">[transição do step atual; senha volta a AGUARDANDO]</text>
  </g>
  <g font-size="13" fill="#777">
    <text x="452" y="400" font-weight="bold">cancelamento</text>
    <text x="452" y="416" font-size="11">[nenhum método grava este estado]</text>
  </g>
  <text x="620" y="520" font-size="11" fill="#555">CANCELADO existe no enum, mas nenhum método do FlowService o grava.</text>
</svg>
