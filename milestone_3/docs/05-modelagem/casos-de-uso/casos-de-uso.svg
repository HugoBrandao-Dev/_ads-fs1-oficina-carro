<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" role="img" font-family="sans-serif">
  <title>Diagrama de casos de uso do FilaCidadã</title>
  <desc>Diagrama UML de casos de uso com quatro atores (ACT-01 Cidadão, ACT-02 Operador, ACT-03 Administrador da Instituição, ACT-04 Administrador da Plataforma), fronteira do sistema FilaCidadã e os quinze casos de uso UC-01 a UC-15. UC-11 estende UC-15 e UC-11 inclui UC-01.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1f5fa8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Fronteira do sistema -->
  <rect x="300" y="40" width="700" height="860" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="1.5"/>
  <text x="316" y="66" font-size="14" font-weight="bold" fill="#222">Sistema FilaCidadã</text>

  <!-- Associações (linhas contínuas) : ACT-01 e ACT-02 à esquerda -->
  <g stroke="#555" stroke-width="1.2" fill="none">
    <line x1="150" y1="200" x2="320" y2="120"/>
    <line x1="150" y1="200" x2="320" y2="220"/>
    <line x1="150" y1="200" x2="320" y2="320"/>
    <line x1="150" y1="200" x2="320" y2="420"/>
    <line x1="150" y1="200" x2="320" y2="520"/>
    <line x1="150" y1="200" x2="320" y2="620"/>
    <line x1="150" y1="600" x2="320" y2="120"/>
    <line x1="150" y1="600" x2="320" y2="420"/>
    <line x1="150" y1="600" x2="320" y2="520"/>
    <line x1="150" y1="600" x2="320" y2="620"/>
    <line x1="150" y1="600" x2="320" y2="720"/>
    <line x1="150" y1="600" x2="320" y2="820"/>
    <!-- ACT-03 e ACT-04 à direita -->
    <line x1="1060" y1="200" x2="980" y2="220"/>
    <line x1="1060" y1="200" x2="980" y2="320"/>
    <line x1="1060" y1="200" x2="980" y2="420"/>
    <line x1="1060" y1="200" x2="980" y2="520"/>
    <line x1="1060" y1="200" x2="980" y2="620"/>
    <line x1="1060" y1="200" x2="980" y2="720"/>
    <line x1="1060" y1="600" x2="980" y2="120"/>
    <line x1="1060" y1="600" x2="980" y2="220"/>
    <line x1="1060" y1="600" x2="980" y2="420"/>
    <line x1="1060" y1="600" x2="980" y2="620"/>
    <line x1="1060" y1="600" x2="980" y2="720"/>
  </g>

  <!-- Relações include e extend -->
  <g stroke="#1f5fa8" stroke-width="1.5" fill="none" stroke-dasharray="6 4">
    <line x1="460" y1="560" x2="460" y2="580" marker-end="url(#seta)"/>
    <line x1="460" y1="480" x2="460" y2="461" marker-end="url(#seta)"/>
  </g>
  <g font-size="12" fill="#1f5fa8" font-style="italic">
    <text x="470" y="574">&lt;&lt;include&gt;&gt;</text>
    <text x="470" y="475">&lt;&lt;extend&gt;&gt;</text>
  </g>

  <!-- Casos de uso: coluna esquerda (cx=460, rx=140, ry=40) -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.2">
    <ellipse cx="460" cy="120" rx="140" ry="40"/>
    <ellipse cx="460" cy="220" rx="140" ry="40"/>
    <ellipse cx="460" cy="320" rx="140" ry="40"/>
    <ellipse cx="460" cy="420" rx="140" ry="40"/>
    <ellipse cx="460" cy="520" rx="140" ry="40"/>
    <ellipse cx="460" cy="620" rx="140" ry="40" fill="#e8f0fb" stroke="#1f5fa8"/>
    <ellipse cx="460" cy="720" rx="140" ry="40"/>
    <ellipse cx="460" cy="820" rx="140" ry="40"/>
  </g>
  <!-- Casos de uso: coluna direita (cx=840) -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.2">
    <ellipse cx="840" cy="120" rx="140" ry="40"/>
    <ellipse cx="840" cy="220" rx="140" ry="40"/>
    <ellipse cx="840" cy="320" rx="140" ry="40"/>
    <ellipse cx="840" cy="420" rx="140" ry="40"/>
    <ellipse cx="840" cy="520" rx="140" ry="40"/>
    <ellipse cx="840" cy="620" rx="140" ry="40"/>
    <ellipse cx="840" cy="720" rx="140" ry="40"/>
  </g>

  <!-- Rótulos dos casos de uso -->
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="460" y="117" font-weight="bold">UC-02</text>
    <text x="460" y="134">Gerenciar perfil</text>

    <text x="460" y="206" font-weight="bold">UC-03</text>
    <text x="460" y="222">Solicitar cadastro</text>
    <text x="460" y="238">de instituição</text>

    <text x="460" y="317" font-weight="bold">UC-08</text>
    <text x="460" y="334">Emitir senha online</text>

    <text x="460" y="406" font-weight="bold">UC-15</text>
    <text x="460" y="422">Acompanhar minha senha</text>
    <text x="460" y="438">(meu atendimento)</text>

    <text x="460" y="506" font-weight="bold">UC-11</text>
    <text x="460" y="522">Finalizar ou cancelar</text>
    <text x="460" y="538">atendimento</text>

    <text x="460" y="617" font-weight="bold">UC-01</text>
    <text x="460" y="634">Autenticar-se</text>

    <text x="460" y="717" font-weight="bold">UC-09</text>
    <text x="460" y="734">Emitir senha presencial</text>

    <text x="460" y="806" font-weight="bold">UC-10</text>
    <text x="460" y="822">Chamar, rechamar</text>
    <text x="460" y="838">e assumir senha</text>

    <text x="840" y="106" font-weight="bold">UC-04</text>
    <text x="840" y="122">Avaliar solicitação</text>
    <text x="840" y="138">de instituição</text>

    <text x="840" y="206" font-weight="bold">UC-05</text>
    <text x="840" y="222">Gerenciar usuários</text>
    <text x="840" y="238">e papéis</text>

    <text x="840" y="317" font-weight="bold">UC-06</text>
    <text x="840" y="334">Gerenciar filas</text>

    <text x="840" y="417" font-weight="bold">UC-07</text>
    <text x="840" y="434">Configurar tipos de etapa</text>

    <text x="840" y="517" font-weight="bold">UC-12</text>
    <text x="840" y="534">Gerenciar QR Codes</text>

    <text x="840" y="606" font-weight="bold">UC-13</text>
    <text x="840" y="622">Consultar dashboard</text>
    <text x="840" y="638">e estatísticas</text>

    <text x="840" y="717" font-weight="bold">UC-14</text>
    <text x="840" y="734">Consultar auditoria</text>
  </g>

  <!-- Nota: inclusão generalizada de UC-01 -->
  <rect x="712" y="790" width="256" height="58" rx="6" fill="#f2f2f2" stroke="#888" stroke-dasharray="4 3"/>
  <text x="724" y="812" font-size="12" fill="#222">Todo caso de uso protegido inclui</text>
  <text x="724" y="830" font-size="12" fill="#222">UC-01 (ligação omitida no diagrama)</text>

  <!-- Atores: ACT-01 Cidadão -->
  <g stroke="#222" stroke-width="1.5" fill="none">
    <circle cx="130" cy="170" r="12"/>
    <path d="M130,182 V225 M105,196 H155 M130,225 L110,256 M130,225 L150,256"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="130" y="282" font-weight="bold">ACT-01</text>
    <text x="130" y="298">Cidadão</text>
  </g>

  <!-- Atores: ACT-02 Operador -->
  <g stroke="#222" stroke-width="1.5" fill="none">
    <circle cx="130" cy="570" r="12"/>
    <path d="M130,582 V625 M105,596 H155 M130,625 L110,656 M130,625 L150,656"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="130" y="682" font-weight="bold">ACT-02</text>
    <text x="130" y="698">Operador</text>
  </g>

  <!-- Atores: ACT-03 Administrador da Instituição -->
  <g stroke="#222" stroke-width="1.5" fill="none">
    <circle cx="1085" cy="170" r="12"/>
    <path d="M1085,182 V225 M1060,196 H1110 M1085,225 L1065,256 M1085,225 L1105,256"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="1085" y="282" font-weight="bold">ACT-03</text>
    <text x="1085" y="298">Administrador</text>
    <text x="1085" y="314">da Instituição</text>
  </g>

  <!-- Atores: ACT-04 Administrador da Plataforma -->
  <g stroke="#222" stroke-width="1.5" fill="none">
    <circle cx="1085" cy="570" r="12"/>
    <path d="M1085,582 V625 M1060,596 H1110 M1085,625 L1065,656 M1085,625 L1105,656"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="1085" y="682" font-weight="bold">ACT-04</text>
    <text x="1085" y="698">Administrador</text>
    <text x="1085" y="714">da Plataforma</text>
  </g>

  <!-- Legenda -->
  <g font-size="12" fill="#444">
    <text x="300" y="935">Linha contínua: associação entre ator e caso de uso. Tracejada com seta: &lt;&lt;include&gt;&gt; e &lt;&lt;extend&gt;&gt;.</text>
    <text x="300" y="955">Operador e Administrador da Instituição também acessam outros casos de uso, listados na matriz do README.</text>
  </g>
</svg>
