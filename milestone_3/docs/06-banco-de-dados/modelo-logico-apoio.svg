<text x="40.0" y="594.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">Notação: PK chave primária; FK chave estrangeira (-&gt; tabela.coluna e regra ON DELETE); UK restrição de unicidade; IDX índice.</text>
<text x="40.0" y="614.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">NOT NULL: coluna obrigatória; NULL: aceita vazio. Tipos conforme mapeamento padrão do Prisma para PostgreSQL 17.</text>
<text x="40.0" y="634.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">(mín,máx) junto à tabela: quantas linhas dela se ligam a uma linha da outra. Ex.: (1,1) na filha = toda linha tem exatamente 1 pai; (0,N) no pai = pode ter 0 ou mais filhas; (0,1) = no máximo 1.</text>
