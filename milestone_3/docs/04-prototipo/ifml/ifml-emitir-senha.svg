<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 800" width="1260" height="800" role="img" aria-labelledby="t d">
<title id="t">IFML: emissão de senha online (FilaCidadã)</title>
<desc id="d">Duas páginas do cidadão. Página A: lista de filas e detalhe com ação Emitir senha (POST /filas/:filaId/senhas). Página B: detalhe da senha emitida, com ação Cancelar senha. Parâmetros: filaId e senhaId.</desc>
<defs>
<marker id="nav" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="dat" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
</defs>
<style>.t{font-family:sans-serif;font-size:12px;fill:#1a1a1a}.bt{font-family:sans-serif;font-size:13px;font-weight:bold;fill:#1a1a1a}.ct{font-family:sans-serif;font-size:14px;font-weight:bold;fill:#1a1a1a}.st{font-family:sans-serif;font-size:12px;fill:#555}.ev{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#1f5fbf}.lb{font-family:sans-serif;font-size:12px;font-style:italic;fill:#333}.lg{font-family:sans-serif;font-size:12px;fill:#1a1a1a}</style>
<rect x="0" y="0" width="1260" height="800" fill="#ffffff"/>
<rect x="30" y="30" width="540" height="530" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="2.4"/>
<text x="44" y="52" class="st">«ViewContainer» Página A (T-CID-02)</text>
<text x="44" y="72" class="ct">Fila e emissão de senha online</text>
<rect x="60" y="90" width="220" height="150" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.3"/>
<text x="72" y="112" class="st">«ViewComponent»</text>
<text x="72" y="132" class="bt">Lista de filas (T-CID-01)</text>
<text x="72" y="152" class="t">nome, tipo, senhas</text>
<text x="72" y="170" class="t">aguardando</text>
<text x="72" y="188" class="t">GET /filas</text>
<rect x="350" y="90" width="200" height="150" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.3"/>
<text x="362" y="112" class="st">«ViewComponent»</text>
<text x="362" y="132" class="bt">Detalhe da fila (T-CID-02)</text>
<text x="362" y="152" class="t">nome, tipo,</text>
<text x="362" y="170" class="t">posição de espera</text>
<text x="362" y="188" class="t">GET /filas/:id</text>
<path d="M280,165 H350" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#dat)"/>
<text x="296" y="152" class="lb" text-anchor="middle">filaId</text>
<circle cx="450" cy="240" r="7" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/>
<text x="462" y="266" class="ev">emitir senha</text>
<rect x="350" y="300" width="200" height="70" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="362" y="320" class="st">«Action»</text>
<text x="362" y="338" class="bt">EmitirSenhaOnline</text>
<text x="362" y="354" class="t">POST /filas/:filaId/senhas</text>
<path d="M450,247 V300" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<text x="362" y="392" class="lb">filaId: fila selecionada (vinculado)</text>
<rect x="650" y="30" width="560" height="530" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="2.4"/>
<text x="664" y="52" class="st">«ViewContainer» Página B (T-CID-04)</text>
<text x="664" y="72" class="ct">Minha senha: status e posição</text>
<rect x="680" y="90" width="490" height="150" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.3"/>
<text x="692" y="112" class="st">«ViewComponent»</text>
<text x="692" y="132" class="bt">Detalhe da senha (T-CID-04)</text>
<text x="692" y="152" class="t">senhaId, código, status (AGUARDANDO, EM_ATENDIMENTO...)</text>
<text x="692" y="170" class="t">posição na fila e tempo estimado</text>
<text x="692" y="188" class="t">GET /senhas/:id</text>
<circle cx="790" cy="240" r="7" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/>
<text x="802" y="262" class="ev">cancelar senha</text>
<text x="802" y="280" class="lb">[status = AGUARDANDO]</text>
<rect x="680" y="320" width="220" height="70" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="692" y="340" class="st">«Action»</text>
<text x="692" y="358" class="bt">CancelarSenha</text>
<text x="692" y="374" class="t">POST /senhas/:id/cancelar</text>
<path d="M790,247 V320" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<path d="M550,348 H612 V205 H680" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<text x="562" y="334" class="lb">sucesso</text>
<text x="562" y="366" class="lb">senhaId</text>
<path d="M790,390 V440 H160 V240" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<text x="300" y="458" class="lb">volta à lista após cancelar</text>
<text x="30" y="606" class="bt">Legenda (IFML)</text>
<rect x="30" y="620" width="150" height="48" fill="#f7f7f7" stroke="#222" stroke-width="2.4" rx="8"/>
<text x="190" y="640" class="lg">ViewContainer: página (tela)</text>
<rect x="520" y="620" width="110" height="40" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.3"/>
<text x="642" y="640" class="lg">ViewComponent: bloco da página</text>
<circle cx="60" cy="680" r="7" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/>
<text x="78" y="684" class="lg">Event: ação do usuário (rótulo azul)</text>
<rect x="520" y="666" width="110" height="32" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="642" y="686" class="lg">Action: operação no servidor (API)</text>
<path d="M30,736 H150" stroke="#222" stroke-width="1.6" marker-end="url(#nav)" fill="none"/>
<text x="190" y="740" class="lg">NavigationFlow: muda de página ou de bloco</text>
<path d="M520,736 H640" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#dat)" fill="none"/>
<text x="654" y="740" class="lg">DataFlow: passa dados sem mudar de página</text>
<text x="30" y="776" class="lg">Parâmetro vinculado (parameter binding): rótulo sobre o fluxo, no formato nome do parâmetro. Guarda entre colchetes: condição de habilitação.</text>
</svg>
