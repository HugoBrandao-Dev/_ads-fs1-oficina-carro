<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 800" width="1260" height="800" role="img" aria-labelledby="t d">
<title id="t">IFML: chamar, rechamar, assumir e finalizar senha (FilaCidadã)</title>
<desc id="d">Duas páginas do operador. Página A: painel do operador e fila em atendimento, com ações Chamar próxima e Rechamar. Página B: detalhe da senha com ações Assumir (somente administrador da instituição), Finalizar e Cancelar.</desc>
<defs>
<marker id="nav" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="dat" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
</defs>
<style>.t{font-family:sans-serif;font-size:12px;fill:#1a1a1a}.bt{font-family:sans-serif;font-size:13px;font-weight:bold;fill:#1a1a1a}.ct{font-family:sans-serif;font-size:14px;font-weight:bold;fill:#1a1a1a}.st{font-family:sans-serif;font-size:12px;fill:#555}.ev{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#1f5fbf}.lb{font-family:sans-serif;font-size:12px;font-style:italic;fill:#333}.lg{font-family:sans-serif;font-size:12px;fill:#1a1a1a}</style>
<rect x="0" y="0" width="1260" height="800" fill="#ffffff"/>
<rect x="30" y="30" width="540" height="530" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="2.4"/>
<text x="44" y="52" class="st">«ViewContainer» Página A (T-OPE-01, T-OPE-02)</text>
<text x="44" y="72" class="ct">Painel do operador e fila</text>
<rect x="60" y="90" width="220" height="150" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.3"/>
<text x="72" y="112" class="st">«ViewComponent»</text>
<text x="72" y="132" class="bt">Painel do operador (T-OPE-01)</text>
<text x="72" y="152" class="t">senha em atendimento</text>
<text x="72" y="170" class="t">GET /senhas/meu-atendimento</text>
<rect x="340" y="90" width="210" height="150" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.3"/>
<text x="352" y="112" class="st">«ViewComponent»</text>
<text x="352" y="132" class="bt">Fila (T-OPE-02)</text>
<text x="352" y="152" class="t">senhas aguardando,</text>
<text x="352" y="170" class="t">por prioridade e ordem</text>
<text x="352" y="188" class="t">GET /senhas</text>
<circle cx="445" cy="240" r="7" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/>
<text x="457" y="266" class="ev">chamar próxima</text>
<rect x="340" y="300" width="210" height="70" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="352" y="320" class="st">«Action»</text>
<text x="352" y="338" class="bt">ChamarSenha</text>
<text x="352" y="354" class="t">POST /senhas/:id/chamar</text>
<path d="M445,247 V300" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<circle cx="170" cy="240" r="7" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/>
<text x="182" y="266" class="ev">rechamar</text>
<rect x="60" y="300" width="220" height="70" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="72" y="320" class="st">«Action»</text>
<text x="72" y="338" class="bt">RechamarSenha</text>
<text x="72" y="354" class="t">POST /senhas/:id/rechamar</text>
<path d="M170,247 V300" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<rect x="650" y="30" width="560" height="530" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="2.4"/>
<text x="664" y="52" class="st">«ViewContainer» Página B (T-OPE-03, T-OPE-04)</text>
<text x="664" y="72" class="ct">Atendimento da senha</text>
<rect x="680" y="90" width="490" height="150" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.3"/>
<text x="692" y="112" class="st">«ViewComponent»</text>
<text x="692" y="132" class="bt">Detalhe da senha (T-OPE-03)</text>
<text x="692" y="152" class="t">código, prioridade, status e fila</text>
<text x="692" y="170" class="t">dados do atendimento em curso</text>
<text x="692" y="188" class="t">GET /senhas/:id</text>
<circle cx="760" cy="240" r="7" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/>
<text x="772" y="262" class="ev">assumir</text>
<circle cx="935" cy="240" r="7" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/>
<text x="947" y="262" class="ev">finalizar</text>
<circle cx="1110" cy="240" r="7" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/>
<text x="1122" y="262" class="ev">cancelar</text>
<rect x="680" y="300" width="160" height="70" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="692" y="320" class="st">«Action»</text>
<text x="692" y="338" class="bt">AssumirSenha</text>
<text x="692" y="354" class="t">[ADMIN_INSTITUICAO]</text>
<rect x="855" y="300" width="160" height="70" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="867" y="320" class="st">«Action»</text>
<text x="867" y="338" class="bt">FinalizarSenha</text>
<text x="867" y="354" class="t">POST /senhas/:id/finalizar</text>
<rect x="1030" y="300" width="160" height="70" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="1042" y="320" class="st">«Action»</text>
<text x="1042" y="338" class="bt">CancelarSenha</text>
<text x="1042" y="354" class="t">POST /senhas/:id/cancelar</text>
<path d="M760,247 V300" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<path d="M935,247 V300" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<path d="M1110,247 V300" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<path d="M680,328 H668 V165 H680" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#dat)"/>
<path d="M935,370 V440 M1110,370 V440 H590 V180 H550" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<text x="700" y="462" class="lb">volta à fila (finalizar ou cancelar)</text>
<path d="M550,348 H612 V205 H680" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#nav)"/>
<text x="30" y="606" class="bt">Legenda (IFML)</text>
<rect x="30" y="620" width="150" height="48" fill="#f7f7f7" stroke="#222" stroke-width="2.4" rx="8"/>
<text x="190" y="640" class="lg">ViewContainer: página (tela)</text>
<rect x="520" y="620" width="110" height="40" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.3"/>
<text x="642" y="640" class="lg">ViewComponent: bloco da página</text>
<circle cx="60" cy="680" r="7" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/>
<text x="78" y="684" class="lg">Event: ação do usuário (rótulo azul)</text>
<rect x="520" y="666" width="110" height="32" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="642" y="686" class="lg">Action: operação no servidor (API)</text>
<path d="M30,736 H150" stroke="#222" stroke-width="1.6" marker-end="url(#nav)" fill="none"/>
<text x="190" y="740" class="lg">NavigationFlow: muda de página ou de bloco</text>
<path d="M520,736 H640" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#dat)" fill="none"/>
<text x="654" y="740" class="lg">DataFlow: passa dados sem mudar de página</text>
<text x="30" y="776" class="lg">Parâmetro vinculado (parameter binding): rótulo sobre o fluxo, no formato nome do parâmetro. Guarda entre colchetes: condição de habilitação.</text>
</svg>
